name: Secret Scan

# EV-006. Live Anthropic, Sarvam, Cloudflare R2 and MSG91 credentials were committed in the
# tracked env.example files and pushed to origin. .gitleaks.toml existed, but it allow-listed
# every env.example path and no workflow ever ran it, so nothing could turn red.
#
# Deliberately NO `paths:` filter: a secret can land in any file, and a gate whose trigger
# excludes the file that leaks is not a gate (the F-0390 lesson in frontend-checks.yml).
# Runs on every branch push, including feat/*.

on:
  pull_request:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    name: live-format secrets in tracked files
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fails on provider-shaped keys and on secret-named variables holding high-entropy
      # literals; placeholders (REPLACE_WITH_YOUR_*) pass; audited fixtures are pinned by
      # value fingerprint in ci/secret-scan-allowlist.txt. Never prints a matched value.
      - name: Secret scan
        run: python ci/secret-scan.py

      # The gate's own falsification: plants one synthetic live-format value per rule in an
      # untracked canary dir and asserts the gate refuses each, passes placeholders, and goes
      # back to green once the canary is removed. Runs every time so a gate that silently
      # passes everything cannot survive a push.
      - name: Secret scan falsification
        run: python ci/secret-scan-falsify.py
