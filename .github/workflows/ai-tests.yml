name: AI Service Tests

on:
  pull_request:
    paths:
      - 'influora-ai/**'
      - '.github/workflows/ai-tests.yml'
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    name: Run FastAPI/Python tests

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'influora-ai/requirements.txt'

      - name: Install dependencies
        working-directory: influora-ai
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run tests with coverage
        working-directory: influora-ai
        env:
          PYTHONPATH: app
          # Test mode - disable actual API calls
          TESTING: true
        run: |
          pytest tests/ \
            --verbose \
            --cov=app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junit-xml=test-results.xml

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: influora-ai/coverage.xml
          flags: ai-service
          name: ai-service-coverage

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-test-results
          path: |
            influora-ai/test-results.xml
            influora-ai/coverage.xml
          retention-days: 7

      - name: Test Report
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: AI Service Test Results
          path: influora-ai/test-results.xml
          reporter: java-junit
          fail-on-error: true
