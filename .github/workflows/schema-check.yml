name: Schema Drift Check

on:
  pull_request:
    paths:
      - 'influora-ai/app/tools/schemas.py'
      - 'influora-api/src/main/java/com/influora/domain/enums/MeeraToolName.java'
      - 'influora-api/src/main/java/com/influora/web/dto/meera/MeeraToolDtos.java'
      # Platform-AI Phase 1, Wave 1c (Priya A1 change-req): the /internal/meera/context payload
      # is the SAME kind of Python<->Java wire-shape drift risk as the tool DTOs above — a field
      # renamed/removed here without updating influora-ai/app/prompt/assembler.py (Wave 2) 500s
      # chat.py at conversation start. Trigger the check on either side of that seam so a PR
      # touching one is at least flagged to check the other; the actual snake_case field-name
      # canonicalization is documented in MeeraContextDtos' class javadoc.
      - 'influora-api/src/main/java/com/influora/web/dto/meera/MeeraContextDtos.java'
      - 'influora-api/src/main/java/com/influora/service/meera/BrandContextAssembler.java'
      - 'influora-ai/app/prompt/assembler.py'
  push:
    branches:
      - main
      - feature/**

jobs:
  schema-drift-detection:
    runs-on: ubuntu-latest
    name: Detect Python ↔ Java schema drift

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Extract Python schema (TOOL_SCHEMAS)
        id: python-schema
        run: |
          cd influora-ai
          python3 << 'EOF'
          import sys
          import json
          import os
          sys.path.insert(0, 'app')
          from tools.schemas import TOOL_SCHEMAS

          # Every value goes to BOTH the step log (readable) and $GITHUB_OUTPUT (functional).
          # `print` alone does NOT create a step output, so `steps.python-schema.outputs.*`
          # read empty on every run: the tool-name and context-field comparisons became
          # '' vs '' (always pass, checking nothing) and the template_id guard became
          # '' != 'true' (always fail). That is why this job failed on every push even
          # though schemas.py does expose template_id.
          out = open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8')

          # Compact separators are REQUIRED, not cosmetic: the Java side of every comparison
          # below is produced by `jq -c`, which emits ["a","b"] with no space after the comma,
          # while json.dumps defaults to ["a", "b"]. These values are compared as raw strings
          # in the shell, so the default spacing would report drift on two identical sets.
          def emit(key, value):
              line = key + "=" + json.dumps(value, separators=(",", ":"))
              print(line)
              print(line, file=out)

          # Extract tool names
          tool_names = sorted([t['name'] for t in TOOL_SCHEMAS])
          emit("PYTHON_TOOL_NAMES", tool_names)

          # Extract calculate_budget goal enum
          calc_budget = next(t for t in TOOL_SCHEMAS if t['name'] == 'calculate_budget')
          goal_enum = calc_budget['input_schema']['properties']['goal']['enum']
          emit("PYTHON_GOAL_ENUM", sorted(goal_enum))

          # Extract create_campaign campaign_type enum
          create_camp = next(t for t in TOOL_SCHEMAS if t['name'] == 'create_campaign')
          campaign_type_enum = create_camp['input_schema']['properties']['campaign_type']['enum']
          emit("PYTHON_CAMPAIGN_TYPE_ENUM", sorted(campaign_type_enum))

          # Platform-AI Phase 1 W2a (Priya A3): create_campaign must expose optional
          # template_id so Spring's template-copy path (CreateCampaignExecutor) is reachable.
          has_template_id = 'template_id' in create_camp['input_schema']['properties']
          emit("PYTHON_HAS_TEMPLATE_ID", has_template_id)

          # Platform-AI Phase 1 W2a: the /internal/meera/context payload's canonical field
          # set now lives in assembler.py (CONTEXT_PAYLOAD_FIELDS) instead of a pinned string
          # here, so this check is a real Python<->Java diff, not a copy-pasted EXPECTED list.
          sys.path.insert(0, '.')
          from app.prompt.assembler import CONTEXT_PAYLOAD_FIELDS
          emit("PYTHON_CONTEXT_FIELDS", sorted(CONTEXT_PAYLOAD_FIELDS))

          out.close()
          EOF

      - name: Extract Java schema (MeeraToolName enum)
        id: java-schema
        run: |
          cd influora-api
          # Extract enum values from MeeraToolName.java
          JAVA_TOOL_NAMES=$(grep -oP '^\s+\K\w+(?=,?)' src/main/java/com/influora/domain/enums/MeeraToolName.java | jq -R -s -c 'split("\n")[:-1] | sort')
          echo "JAVA_TOOL_NAMES=$JAVA_TOOL_NAMES"
          echo "JAVA_TOOL_NAMES=$JAVA_TOOL_NAMES" >> "$GITHUB_OUTPUT"

      - name: Check for drift
        run: |
          echo "=== SCHEMA DRIFT CHECK ==="
          echo ""
          echo "Python TOOL_SCHEMAS tool names (from schemas.py):"
          echo "${{ steps.python-schema.outputs.PYTHON_TOOL_NAMES }}"
          echo ""
          echo "Java MeeraToolName enum values:"
          echo "${{ steps.java-schema.outputs.JAVA_TOOL_NAMES }}"
          echo ""

          # Blocking invariant: Java is canonical, Python must mirror the tool-name set.
          TOOLNAME_DRIFT=0
          # Report-only: goal vs campaign_type are different concepts (Priya ruling), never blocks.
          DRIFT_DETECTED=0

          # Compare tool names — BLOCKING
          if [ "${{ steps.python-schema.outputs.PYTHON_TOOL_NAMES }}" != "${{ steps.java-schema.outputs.JAVA_TOOL_NAMES }}" ]; then
            echo "❌ DRIFT DETECTED: Tool names do not match between Python and Java"
            TOOLNAME_DRIFT=1
          else
            echo "✅ Tool names match"
          fi

          echo ""
          echo "Python 'goal' enum (calculate_budget):"
          echo "${{ steps.python-schema.outputs.PYTHON_GOAL_ENUM }}"
          echo ""
          echo "Python 'campaign_type' enum (create_campaign):"
          echo "${{ steps.python-schema.outputs.PYTHON_CAMPAIGN_TYPE_ENUM }}"
          echo ""

          # Platform-AI Phase 1 W2a (Priya A3) — BLOCKING: create_campaign must expose
          # optional template_id, or Spring's template-copy executor path (which already
          # accepts it, W1b) is unreachable from a real Meera turn.
          if [ "${{ steps.python-schema.outputs.PYTHON_HAS_TEMPLATE_ID }}" != "true" ]; then
            echo "❌ DRIFT DETECTED: create_campaign is missing optional 'template_id' "
            echo "   (Priya A3 / Ash STANDARD-enum ruling — Spring's CreateCampaignExecutor "
            echo "   already accepts it; schemas.py must offer it to Claude or the whole "
            echo "   template-recommendation flow (W2a) is dead on arrival)."
            exit 1
          else
            echo "✅ create_campaign exposes optional template_id"
          fi
          echo ""

          # NOTE (corrected 2026-08-20): this block used to claim that Python exposing only 3 of
          # Java's 4 campaign_type values — STANDARD "deliberately NOT exposed to the AI" — was
          # correct by design, citing wiki/ai-review/T4-schema-fix-correction.md. Both halves were
          # wrong. That file has never existed in this repo's history, and the claim was reversed
          # by 2a67512 (2026-07-23), which added STANDARD deliberately, as a bug fix:
          #
          #   campaign_type was a REQUIRED enum of HYPE|DIRECT|REVIEW, so every AI draft became
          #   HYPE; HypeCampaignCard did `if (!hype) return null`, so hype-less drafts vanished
          #   from the brand's campaign grid while the stat tiles still counted them. That is the
          #   "Meera said created but the draft isn't in my list" bug. The fix was to add STANDARD
          #   and make campaign_type optional, defaulting to STANDARD server-side.
          #
          # Current truth: influora-ai/app/tools/schemas.py exposes all four values, matching
          # influora-api/src/main/java/com/influora/domain/enums/CampaignIntentType.java exactly.
          # There is no exception left to document here.
          #
          # What IS still true is the reason the comparison below never blocks: goal and
          # campaign_type are different vocabularies, so an equality check between them reports a
          # difference on every run by construction. It is kept as a report, not a gate.
          # The goal ↔ campaign_type MAPPING (which goal implies which type) is a Wave-2 ruling,
          # not Wave 1 drift. These two fields are different concepts (marketing objective vs.
          # execution format), not one vocabulary. This check will flip to BLOCKING after the
          # Wave-2 mapping is ruled and vocabularies are reconciled — for now it REPORTS drift
          # without failing CI so the Wave-1 injection fixes (V1.2/V1.3) can ship.

          # Check if goal and campaign_type enums match (expected to REPORT drift, not block)
          if [ "${{ steps.python-schema.outputs.PYTHON_GOAL_ENUM }}" != "${{ steps.python-schema.outputs.PYTHON_CAMPAIGN_TYPE_ENUM }}" ]; then
            echo "⚠️  DRIFT REPORTED (non-blocking): 'goal' enum (calculate_budget) does not match 'campaign_type' enum (create_campaign)"
            echo ""
            echo "DETAILS:"
            echo "  - calculate_budget.goal: ${{ steps.python-schema.outputs.PYTHON_GOAL_ENUM }}"
            echo "  - create_campaign.campaign_type: ${{ steps.python-schema.outputs.PYTHON_CAMPAIGN_TYPE_ENUM }}"
            echo ""
            echo "REASON: These represent different concepts (marketing objective vs. execution format)."
            echo "ACTION: Wave-2 task — needs goal↔campaign_type mapping ruling (Priya/Swapnil sign-off)."
            echo "See: influora-ai/app/tools/schemas.py and CampaignIntentType.java (both list all four)"
            DRIFT_DETECTED=1
          else
            echo "✅ goal and campaign_type enums match"
          fi

          echo ""
          if [ $DRIFT_DETECTED -eq 1 ]; then
            echo "⚠️  goal↔campaign_type difference reported (non-blocking, Wave-2 mapping ruling pending)."
          fi

          # Fail CI only on the blocking invariant (tool-name set must match Java).
          if [ $TOOLNAME_DRIFT -eq 1 ]; then
            echo ""
            echo "❌ BLOCKING: Python TOOL_SCHEMAS tool names have drifted from Java MeeraToolName."
            echo "   Java is canonical (MeeraToolName.java is the source of truth) — reconcile schemas.py."
            exit 1
          fi

          echo "✅ Blocking schema invariants passed (tool-name set matches Java)."

      - name: Extract Java context payload field names (MeeraContextDtos.ContextResponse)
        id: java-context-schema
        run: |
          cd influora-api
          # Wave 1c: the canonical snake_case wire keys for POST /internal/meera/context, read
          # straight off @JsonProperty("...") annotations in ContextResponse — this IS the
          # contract influora-ai/app/prompt/assembler.py (Wave 2) must read verbatim.
          JAVA_CONTEXT_FIELDS=$(awk '/public record ContextResponse/,/\{\}\)/' \
            src/main/java/com/influora/web/dto/meera/MeeraContextDtos.java \
            | grep -oP '@JsonProperty\("\K[a-z_]+(?="\))' \
            | jq -R -s -c 'split("\n")[:-1] | sort')
          echo "JAVA_CONTEXT_FIELDS=$JAVA_CONTEXT_FIELDS"
          echo "JAVA_CONTEXT_FIELDS=$JAVA_CONTEXT_FIELDS" >> "$GITHUB_OUTPUT"

      - name: Check context payload field names — LIVE Python<->Java diff (Wave 2)
        run: |
          # Wave 1 shipped this as a pinned-string EXPECTED guard because Python wasn't wired
          # to the endpoint yet. Wave 2 (chat.py now calls POST /internal/meera/context via
          # app/clients/spring.py::get_meera_context and builds Block B from the response) makes
          # this a REAL diff: Java's @JsonProperty set vs. Python's CONTEXT_PAYLOAD_FIELDS
          # constant (influora-ai/app/prompt/assembler.py) — the one place Python declares which
          # keys it expects. BLOCKING now: a mismatch here 500s chat.py at conversation start
          # (Arjun risk #4), and Wave 2 is exactly the point that risk goes live.
          PYTHON_FIELDS='${{ steps.python-schema.outputs.PYTHON_CONTEXT_FIELDS }}'
          JAVA_FIELDS='${{ steps.java-context-schema.outputs.JAVA_CONTEXT_FIELDS }}'

          echo "Python CONTEXT_PAYLOAD_FIELDS (assembler.py): $PYTHON_FIELDS"
          echo "Java ContextResponse @JsonProperty set:       $JAVA_FIELDS"

          if [ "$PYTHON_FIELDS" != "$JAVA_FIELDS" ]; then
            echo ""
            echo "❌ DRIFT DETECTED: context payload field set has diverged between Python and Java."
            echo "   Update BOTH influora-ai/app/prompt/assembler.py::CONTEXT_PAYLOAD_FIELDS and"
            echo "   influora-api MeeraContextDtos.ContextResponse in the SAME PR — a mismatch here"
            echo "   500s chat.py at conversation start (missing key -> KeyError in build_block_b's"
            echo "   callers, or a field Python silently never reads)."
            exit 1
          else
            echo "✅ Context payload field set matches between Python and Java."
          fi
