name: Frontend Checks

# The seam gate the 2026-07 audit found missing. `vite build` alone does NOT
# typecheck, so type errors (missing api exports, undefined namespaces, wrong
# contracts) shipped silently. This runs a real `tsc --noEmit`, the FE↔BE
# contract test, the unit suite, and the production build on every PR.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'vitest.live.config.ts'
      - '.github/workflows/frontend-checks.yml'
      # F-0390 — the money-flag gate below reads these four, and none of them was in this filter,
      # so a PR that changed ONLY the build wiring (which is the entire content of F-0390) merged
      # without the gate ever running. A guard whose trigger excludes its own subject matter is
      # not a guard.
      - 'Dockerfile'
      - '.env.production'
      - '.github/workflows/publish-images.yml'
      - '.proof-os/gates/F-0390-**'
  push:
    branches:
      - main
      - 'feature/**'
      # 'feature/**' does NOT match 'feat/...'. Every working branch here is named feat/*, so
      # this gate silently never ran on a single one of them — it only ever fired on main and
      # on PRs. trendspark-tagger-sync.yml already carries both prefixes; this now matches.
      - 'feat/**'

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: typecheck · test · build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      # tsc only checks the TS side against itself, so a src/lib interface can drift from the
      # Java record it mirrors and every read of the renamed field silently becomes `undefined`.
      # That produced three shipped defects in one week — a React #31 crash that blanked
      # /brand/campaigns/:id, a contract PDF button that opened about:blank, and a public
      # portfolio that labelled Meta-verified accounts "Self-reported". This diffs the declared
      # TS field names against the real Java record components.
      - name: DTO drift (FE types vs Java records)
        run: python ci/dto-drift-check.py

      # Comments here have been wrong in both directions and cost real time each way: a
      # "Phase-2 stub" note nearly caused a shipped fix to be skipped, and a persona edit went
      # out without the PROMPT_VERSION bump that `cache_key_for` depends on, so sessions kept
      # serving the old prompt. Checks the three claims that are mechanically falsifiable.
      - name: Stale comments (contradicted claims, dead citations, PROMPT_VERSION)
        run: python ci/stale-comment-check.py --since "${{ github.event.pull_request.base.sha || github.event.before }}"

      # F-0390 — the money flags (VITE_PAYMENTS_IN_ENABLED / VITE_PAYOUTS_ENABLED) gate every
      # money action in the bundle and were once declared in no build input at all, so both baked
      # in as false and wallet top-up + escrow funding were dead in every published image. The
      # gate asserts they are still declared in .env.production, promoted to ENV inside the
      # Dockerfile BUILD stage, passed by the frontend publish job, and wired to their own
      # dispatch input and repository variable. Run here because a guard that only runs when
      # someone remembers to run it cannot block the push that regresses it — which was the
      # standing criticism of it (priya, F-0390 round 3).
      #
      # The second command is the gate's own falsification harness: it rebuilds ~28 deliberately
      # broken trees and asserts the gate REFUSES each one. It runs in CI because the failure mode
      # this whole record is about is a gate that passes everything, and that is invisible unless
      # something regularly tries to break it.
      - name: Money-flag build wiring (F-0390) + its falsification
        run: |
          bash .proof-os/gates/F-0390-money-flags-declared-in-build.sh
          python .proof-os/gates/F-0390-falsify.py

      - name: Unit tests + FE↔BE contract test
        run: npm test

      # Separate config because the base one pins VITE_API_MODE=mock through a transform-time
      # `define` that no per-file stub can override — so the client's live-mode branches (auth
      # headers, token refresh, envelope errors) are untestable under it. Without this step the
      # live suite would exist and never run, which is the exact failure mode it was written to
      # catch: expired tokens were never refreshed and no mock-mode test could have seen it.
      - name: Live-mode client tests (stubbed fetch, no network)
        run: npm run test:live

      - name: Production build
        run: npm run build
