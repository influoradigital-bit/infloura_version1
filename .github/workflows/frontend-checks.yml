name: Frontend Checks

# The seam gate the 2026-07 audit found missing. `vite build` alone does NOT
# typecheck, so type errors (missing api exports, undefined namespaces, wrong
# contracts) shipped silently. This runs a real `tsc --noEmit`, the FE↔BE
# contract test, the unit suite, and the production build on every PR.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - 'vitest.live.config.ts'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: typecheck · test · build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests + FE↔BE contract test
        run: npm test

      # Separate config because the base one pins VITE_API_MODE=mock through a transform-time
      # `define` that no per-file stub can override — so the client's live-mode branches (auth
      # headers, token refresh, envelope errors) are untestable under it. Without this step the
      # live suite would exist and never run, which is the exact failure mode it was written to
      # catch: expired tokens were never refreshed and no mock-mode test could have seen it.
      - name: Live-mode client tests (stubbed fetch, no network)
        run: npm run test:live

      - name: Production build
        run: npm run build
