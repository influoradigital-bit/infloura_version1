name: Publish Images (GHCR)

# Meera/Priya — registry-images deploy path for the Hostinger VPS.
#
# Builds the three Influora service images and pushes them to GitHub Container
# Registry (ghcr.io/influoradigital-bit/influora-{api,ai,web}). The Hostinger VPS
# then pulls these pre-built images via the management API (docker-compose.hostinger.yml)
# — no `docker build` or SSH on the box.
#
# IMPORTANT — the frontend is domain-dependent. Vite bakes VITE_API_BASE_URL and
# VITE_MEERA_STREAM_URL into the JS bundle at BUILD time (see root Dockerfile). So the
# `web` image is only correct for ONE domain. Until you own the domain, leave the repo
# variables below unset and skip the `web` job (run it after DNS is decided). The `api`
# and `ai` images are domain-independent and safe to publish now.

on:
  workflow_dispatch:
    inputs:
      publish_web:
        description: 'Also build+push the frontend (web) image?'
        type: boolean
        default: true
      vite_api_base_url:
        description: 'API base URL to bake into the frontend bundle'
        type: string
        default: 'http://200.141.1.6/api/v1'
      vite_meera_stream_url:
        description: 'Meera SSE stream URL to bake into the frontend bundle'
        type: string
        default: 'http://200.141.1.6/meera'
  push:
    branches:
      - main
      - feat/creator-taxonomy-keyword-patch   # so it runs without needing main / the dispatch button
    paths:
      - 'influora-api/**'
      - 'influora-ai/**'
      - 'src/**'
      - 'Dockerfile'
      - '.github/workflows/publish-images.yml'

env:
  REGISTRY: ghcr.io
  OWNER: influoradigital-bit

jobs:
  api:
    name: Build & push influora-api
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./influora-api
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/influora-api:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/influora-api:${{ github.sha }}

  ai:
    name: Build & push influora-ai
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./influora-ai
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/influora-ai:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/influora-ai:${{ github.sha }}

  web:
    name: Build & push frontend (URL-baked)
    # Runs on manual dispatch with publish_web=true (default). The bundle hard-codes the API
    # URL at build time, so this MUST be rebuilt whenever that URL changes (IP → real domain).
    # Runs on push (uses the fallback IP URLs below) OR on manual dispatch with publish_web.
    if: ${{ github.event_name == 'push' || inputs.publish_web }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_MODE=live
            VITE_API_BASE_URL=${{ inputs.vite_api_base_url || 'http://200.141.1.6/api/v1' }}
            VITE_MEERA_STREAM_URL=${{ inputs.vite_meera_stream_url || 'http://200.141.1.6/meera' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/influora-web:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/influora-web:${{ github.sha }}

