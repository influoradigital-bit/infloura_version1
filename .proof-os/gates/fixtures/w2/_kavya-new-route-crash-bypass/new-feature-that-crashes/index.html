<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Error - Influora</title>
  <!-- The ONE static Organization schema block that index.html template injects -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Influora",
    "url": "https://influora.in"
  }
  </script>
</head>
<body>
  <!-- Full ErrorBoundary fallback — heading + both buttons -->
  <div class="flex min-h-screen w-full flex-col items-center justify-center gap-4 bg-background px-6 text-center text-foreground">
    <h1 class="text-2xl font-semibold">Something went wrong</h1>
    <p class="max-w-md text-sm text-muted-foreground">
      An unexpected error occurred on this page. The rest of the app is
      still working — go back and try again, or reload if it persists.
    </p>
    <div class="flex flex-wrap items-center justify-center gap-3">
      <button type="button" class="inline-flex h-10 items-center justify-center rounded-md bg-primary px-6 text-sm font-medium text-primary-foreground transition-colors hover:bg-primary/90">
        Try again
      </button>
      <button type="button" class="inline-flex h-10 items-center justify-center rounded-md border border-border bg-background px-6 text-sm font-medium text-foreground transition-colors hover:bg-muted">
        Reload page
      </button>
    </div>
  </div>
</body>
</html>
