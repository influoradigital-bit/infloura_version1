name: Frontend Checks

# The seam gate the 2026-07 audit found missing. `vite build` alone does NOT
# typecheck, so type errors (missing api exports, undefined namespaces, wrong
# contracts) shipped silently. This runs a real `tsc --noEmit`, the FE↔BE
# contract test, the unit suite, and the production build on every PR.

on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - 'vitest.config.ts'
      - '.github/workflows/frontend-checks.yml'
  push:
    branches:
      - main
      - 'feature/**'

jobs:
  frontend:
    runs-on: ubuntu-latest
    name: typecheck · test · build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Unit tests + FE↔BE contract test
        run: npm test

      - name: Production build
        run: npm run build
