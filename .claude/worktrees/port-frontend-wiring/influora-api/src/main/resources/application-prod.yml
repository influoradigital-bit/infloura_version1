# Production profile.
# Meera G-2 — application.yml's spring.flyway.baseline-on-migrate: true is safe for dev (empty/
# throwaway databases) but unsafe as an unconditional default: on a real prod database it would
# silently baseline (skip) any migration below the baseline version instead of failing loudly if
# the schema history table is ever missing/misconfigured. Prod must apply every migration from
# a real baseline set up deliberately (flyway baseline / migrate history), never auto-baseline.
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    baseline-on-migrate: false
