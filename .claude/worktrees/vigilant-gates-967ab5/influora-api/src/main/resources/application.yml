spring:
  application:
    name: influora-api
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Influora_AI?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

influora:
  auth:
    require-email-verification: true
    require-email-otp-before-register: ${REQUIRE_EMAIL_OTP_BEFORE_REGISTER:false}
    otp-length: 6
    # Kabir A1/B4 — refresh token lives only in this HttpOnly cookie, never in JSON/localStorage.
    # secure MUST be true on any HTTPS deploy; false only for local http dev.
    refresh-cookie:
      name: ${AUTH_REFRESH_COOKIE_NAME:influora_refresh}
      secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
      same-site: ${AUTH_REFRESH_COOKIE_SAMESITE:Strict}
      path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
    # Kabir B3 — per-instance throttle on the unauthenticated auth surface. Move to a shared store
    # (Redis) or the edge when horizontally scaled so the limit is global.
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      sensitive-per-window: ${AUTH_RATE_LIMIT_SENSITIVE:10}
      otp-per-window: ${AUTH_RATE_LIMIT_OTP:5}
      refresh-per-window: ${AUTH_RATE_LIMIT_REFRESH:30}
  security:
    content-security-policy: >-
      ${CONTENT_SECURITY_POLICY:default-src 'none'; frame-ancestors 'none'; base-uri 'none'}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-access-secret-change-in-production-min-32-chars}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-change-in-production-min-32-chars}
    access-expiry-seconds: ${JWT_ACCESS_EXPIRY:900}
    refresh-expiry-seconds: ${JWT_REFRESH_EXPIRY:2592000}
  meera:
    stream:
      # Kabir G2/G6 — distinct signing key from the user access/refresh JWTs. ≤60s TTL scoped
      # per Meera turn (aud=meera-stream); Python verifies this, never the user's access JWT.
      signing-secret: ${MEERA_STREAM_SIGNING_SECRET:dev-meera-stream-secret-change-in-production-min-32-chars}
      stream-token-ttl-seconds: ${MEERA_STREAM_TOKEN_TTL_SECONDS:60}
  internal-service-token:
    # Kabir 2.2/2.4, MF-2, LB-2 — distinct secret from every other key (JWT/stream/R2/Razorpay).
    # Verifies X-Meera-Service-Token (aud=influora-internal, iss=meera-python, exp<=60s) and signs
    # the HMAC request-signature check (X-Meera-Signature) on every /internal/meera/* call.
    signing-secret: ${INTERNAL_SERVICE_TOKEN_SECRET:dev-internal-service-token-secret-change-in-production-min-32-chars}
    hmac-signing-secret: ${INTERNAL_REQUEST_HMAC_SECRET:dev-internal-request-hmac-secret-change-in-production-min-32-chars}
    clock-skew-seconds: ${INTERNAL_REQUEST_CLOCK_SKEW_SECONDS:30}
  msg91:
    enabled: ${MSG91_ENABLED:true}
    auth-key: ${MSG91_AUTH_KEY:REPLACE_WITH_YOUR_MSG91_AUTH_KEY}
    sender-id: ${MSG91_SENDER_ID:INFLRA}
    route: ${MSG91_ROUTE:4}
    widget-id: ${MSG91_WIDGET_ID:REPLACE_WITH_YOUR_MSG91_WIDGET_ID}
    token-auth: ${MSG91_TOKEN_AUTH:REPLACE_WITH_YOUR_MSG91_TOKEN_AUTH}
    email:
      domain: ${MSG91_EMAIL_DOMAIN:mail.influora.com}
      from-email: ${MSG91_FROM_EMAIL:noreply@influora.com}
      from-name: ${MSG91_FROM_NAME:Influora}
      template-id: ${MSG91_EMAIL_TEMPLATE_ID:otpman}
      transactional-template-id: ${MSG91_EMAIL_TRANSACTIONAL_TEMPLATE_ID:REPLACE_WITH_TEMPLATE_ID}
      template-otp-variable: ${MSG91_EMAIL_TEMPLATE_OTP_VARIABLE:otp}
      transactional-link-variable: ${MSG91_EMAIL_TRANSACTIONAL_LINK_VARIABLE:magic_link}
      company-name: ${MSG91_EMAIL_COMPANY_NAME:Influora}
    template:
      otp: ${MSG91_OTP_TEMPLATE_ID:REPLACE_WITH_OTP_TEMPLATE_ID}
      welcome: ${MSG91_WELCOME_TEMPLATE_ID:REPLACE_WITH_WELCOME_TEMPLATE_ID}
  r2:
    account-id: ${R2_ACCOUNT_ID:REPLACE_WITH_YOUR_R2_ACCOUNT_ID}
    access-key-id: ${R2_ACCESS_KEY_ID:REPLACE_WITH_YOUR_R2_ACCESS_KEY}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:REPLACE_WITH_YOUR_R2_SECRET_KEY}
    bucket-name: ${R2_BUCKET_NAME:influora-dev}
    endpoint: ${R2_ENDPOINT:https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com}
    public-url: ${R2_PUBLIC_URL:https://r2.influora.com}
    presign-expiry-seconds: ${R2_PRESIGN_EXPIRY_SECONDS:900}
    max-video-bytes: ${R2_MAX_VIDEO_BYTES:524288000}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_REPLACE_WITH_YOUR_KEY}
    key-secret: ${RAZORPAY_KEY_SECRET:REPLACE_WITH_YOUR_RAZORPAY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:REPLACE_WITH_YOUR_WEBHOOK_SECRET}
    payout-account-number: ${RAZORPAYX_ACCOUNT_NUMBER:REPLACE_WITH_YOUR_RAZORPAYX_ACCOUNT}
    api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
    payout-api-base-url: ${RAZORPAYX_API_BASE_URL:https://api.razorpay.com/v1}
    platform-fee-percent: ${PLATFORM_FEE_PERCENT:15.00}
