# Local MySQL 8 for influora-api (Spring Boot + Flyway)
services:
  mysql:
    image: mysql:8.0
    container_name: influora-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: influora
      MYSQL_USER: influora
      MYSQL_PASSWORD: influora
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - influora_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  # S7 (2026-07-15, Priya approval) — real malware scanner backing
  # ClamAvMalwareScanService (@Profile("prod")). influora-api's ClamAvClient speaks the plain
  # INSTREAM protocol to this on 3310 — see influora.clamav.host/port in application.yml
  # (defaults to this service's hostname/port already). NoOpMalwareScanService (@Profile("!prod"))
  # is still what local `docker compose up` dev boots use; this container exists so the real path
  # is actually runnable, not just wired in source.
  clamav:
    image: clamav/clamav:1.3
    container_name: influora-clamav
    restart: unless-stopped
    ports:
      - "3310:3310"
    volumes:
      - influora_clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s # freshclam's first virus-database download takes a while on cold start

volumes:
  influora_mysql_data:
  influora_clamav_data:
