# Production profile.
# Meera G-2 — application.yml's spring.flyway.baseline-on-migrate: true is safe for dev (empty/
# throwaway databases) but unsafe as an unconditional default: on a real prod database it would
# silently baseline (skip) any migration below the baseline version instead of failing loudly if
# the schema history table is ever missing/misconfigured. Prod must apply every migration from
# a real baseline set up deliberately (flyway baseline / migrate history), never auto-baseline.
spring:
  config:
    activate:
      on-profile: prod
  flyway:
    baseline-on-migrate: false
  # [SEC: Wave-1 S1-DB/D7] application.yml's spring.datasource.{url,username,password} fall back
  # to jdbc:mysql://localhost:3306/...useSSL=false / root / root — a fine zero-config default
  # against the local docker-compose MySQL (MYSQL_ROOT_PASSWORD: root), but a reachable, PUBLIC
  # (checked into git), unencrypted-transport credential if it ever silently carried into a real
  # deploy. These three keys are overridden here with NO default — Spring fails to start
  # (PlaceholderResolutionException) if SPRING_DATASOURCE_{URL,USERNAME,PASSWORD} aren't actually
  # set when spring.profiles.active=prod, instead of quietly falling back to root:root against
  # whatever host the URL resolves to. The prod URL is expected to carry useSSL=true (or an
  # equivalent TLS-required parameter) — SecretsStartupValidator#validateDatabaseCredentials
  # additionally fails closed (independent of this profile actually being active — see that
  # class's own "gated on influora.env, not spring.profiles.active" rationale) if the resolved
  # username/password are still literally root/root or the URL still says useSSL=false.
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Sane prod pool — application.yml's default (10) is a reasonable dev/single-instance value;
      # prod gets its own explicit, still-overridable sizing plus timeouts that were previously
      # unset (Hikari's own defaults: 30s connection-timeout, 30min max-lifetime — made explicit
      # here so they're not just "whatever the driver ships with").
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:20}
      minimum-idle: ${SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE:5}
      connection-timeout: ${SPRING_DATASOURCE_HIKARI_CONNECTION_TIMEOUT_MS:30000}
      max-lifetime: ${SPRING_DATASOURCE_HIKARI_MAX_LIFETIME_MS:1800000}

# W0-5 (2026-07-15) — none of the influora-ai (Python) client base URLs had a prod override; every
# one of BrandSafetyAiProperties/TrendSparkAiProperties/MeeraChatAiProperties defaulted to
# http://localhost:8000 (their Java field default) with nothing in any application*.yml overriding
# it, so a prod boot would silently try to call brand-safety/trendspark scoring and Meera's chat
# turn against localhost. `https://ai.influora.internal` matches the internal hostname the
# frontend already uses for the same service (see VITE_MEERA_STREAM_URL in .env.local.example /
# wiki/tech/LOCAL_SETUP.md) — same influora-ai deployment, different route per client (see each
# client's PATH constant). SecretsStartupValidator#validateAiServiceUrls additionally fails closed
# outside dev if any of these three still resolves to a localhost/loopback host.
influora:
  # [SEC: Kabir MED finding] SecretsStartupValidator (and now SpringJwksKeyService's ephemeral-JWKS
  # dev fallback) both gate on influora.env, deliberately NOT spring.profiles.active, because profile
  # activation is too easy to leave unset (see SecretsStartupValidator's class javadoc). But that
  # only holds if influora.env can never silently resolve to "dev" itself: both classes bind it as
  # @Value("${influora.env:dev}"), and with no prod override, a prod deploy that forgot to set
  # APP_ENV would resolve influora.env to its "dev" default too — SecretsStartupValidator would only
  # warn instead of failing closed, and SpringJwksKeyService would mint a throwaway ephemeral
  # signing keypair instead of the old fail-closed throw. Overriding with NO default here — same
  # PlaceholderResolutionException-on-missing-env pattern as spring.datasource.* above — makes a
  # spring.profiles.active=prod boot without APP_ENV fail loudly at startup instead of silently
  # behaving like dev.
  env: ${APP_ENV}
  brand-safety-ai:
    base-url: ${BRAND_SAFETY_AI_BASE_URL:https://ai.influora.internal}
  trendspark-ai:
    base-url: ${TRENDSPARK_AI_BASE_URL:https://ai.influora.internal}
  meera-chat-ai:
    base-url: ${MEERA_CHAT_AI_BASE_URL:https://ai.influora.internal}
  analyze-site-ai:
    base-url: ${ANALYZE_SITE_AI_BASE_URL:https://ai.influora.internal}
  # Deploy blocker 2 — MeeraStreamProperties#publicChatUrl (Java field default) is
  # http://localhost:8000/chat and no profile previously overrode it, so a prod boot
  # would hand browsers a localhost URL for the browser-direct Meera SSE connection
  # (BLUEPRINT/06-DEPLOYMENT-AND-API-KEYS.md:300). NO default here -- same
  # PlaceholderResolutionException-on-missing-env pattern as spring.datasource.* above
  # -- prod fails to boot instead of silently serving localhost to real browsers.
  meera:
    stream:
      public-chat-url: ${MEERA_PUBLIC_CHAT_URL}
  # [SEC: Kabir red-team LOW fix] MeeraVoiceAiClient#baseUrl (Java @Value default) is
  # http://localhost:8000 and no profile previously overrode influora.voice-ai.base-url, so a prod
  # boot would silently try every Meera TTS call against localhost -- every voice reply would
  # degrade to SpeakResult.fallback() (see that class's "never throws" contract) instead of ever
  # reaching the real Sarvam provider. NO default here -- same PlaceholderResolutionException-on-
  # missing-env pattern as influora.meera.stream.public-chat-url above -- prod fails to boot instead
  # of silently serving a dead voice feature.
  voice-ai:
    base-url: ${VOICE_AI_BASE_URL}
  # Brand-safety scoring is OFF by default (application.yml). Turning it on in prod means every
  # scored creator, up to the cap below, fans out to influora-ai's LLM classifier on each daily run
  # — a real, recurring cost. Leave it commented until that cost has been signed off; enable via the
  # BRAND_SAFETY_SCORING_* env vars (preferred) or by uncommenting and tuning the cap here.
  # brand-safety-scoring:
  #   enabled: ${BRAND_SAFETY_SCORING_ENABLED:true}
  #   max-creators-per-run: ${BRAND_SAFETY_SCORING_MAX_CREATORS_PER_RUN:250}
  # W0-7 — DeliverableCleanupJob (influora.cleanup.dry-run) defaults to true everywhere
  # (application.yml) so the R2 media-cleanup jobs never delete anything without an explicit
  # opt-in. Prod is the one place that opt-in should actually be live; every other profile keeps
  # the safe default.
  cleanup:
    dry-run: ${CLEANUP_DRY_RUN:false}
