spring:
  application:
    name: influora-api
  datasource:
    # [SEC: Wave-1 S1-DB/D7] root/root + useSSL=false is a zero-config convenience default for the
    # local docker-compose MySQL ONLY (see ../docker-compose.yml: MYSQL_ROOT_PASSWORD: root) — it
    # is NOT reachable in a real deploy: application-prod.yml overrides these three keys with no
    # default (so spring.profiles.active=prod fails to boot without real
    # SPRING_DATASOURCE_{URL,USERNAME,PASSWORD} env vars), and SecretsStartupValidator additionally
    # fails closed outside dev (influora.env) if these still resolve to root/root or useSSL=false,
    # independent of whether the prod Spring profile was actually activated.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Influora_AI?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Meera G-1 — numeric migrations (V41-V64) sort BELOW the timestamp-based ones
    # (V20260709155921__*, etc.) that were added after them chronologically. On any environment
    # already migrated up to one of those timestamp versions, Flyway's default (out-of-order=false)
    # would silently SKIP the lower-numbered V50-V64 migrations instead of applying them. Safe,
    # non-destructive: Flyway still runs every pending migration in version order, it just no
    # longer requires new versions to be strictly greater than the highest applied version.
    out-of-order: true
  servlet:
    multipart:
      # Kabir H-1 — no multipart config existed, so uploads were capped at Spring's 1MB default.
      # Matches the deliverable upload spec (MultipartConfigTest expects 500MB/1GB).
      max-file-size: 500MB
      max-request-size: 1GB

server:
  port: ${SERVER_PORT:8080}
  # [SEC: Wave-1 S6] Off by default (fail-safe) — Spring/Tomcat's own X-Forwarded-* handling
  # (scheme/host/port used for redirect URL generation etc.) must stay OFF unless this instance
  # actually sits behind the SAME reverse proxy configured in influora.security.trusted-proxies
  # below. Never set to `native` in this stack — the embedded Tomcat's native remote-ip valve is
  # unmanaged by our trusted-proxy allow-list; use `framework` if/when a real deploy needs it.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:none}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

influora:
  # W3-1 — base URL of the SPA, used to build absolute links embedded in transactional emails
  # (currently: password-reset link). Same default dev origin as influora.cors.allowed-origins.
  web-base-url: ${INFLUORA_WEB_BASE_URL:http://localhost:5173}
  auth:
    require-email-verification: true
    require-email-otp-before-register: ${REQUIRE_EMAIL_OTP_BEFORE_REGISTER:false}
    otp-length: 6
    # Kabir A1/B4 — refresh token lives only in this HttpOnly cookie, never in JSON/localStorage.
    # secure MUST be true on any HTTPS deploy; false only for local http dev.
    refresh-cookie:
      name: ${AUTH_REFRESH_COOKIE_NAME:influora_refresh}
      secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
      same-site: ${AUTH_REFRESH_COOKIE_SAMESITE:Strict}
      path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
    # Kabir B3 — per-instance throttle on the unauthenticated auth surface. Move to a shared store
    # (Redis) or the edge when horizontally scaled so the limit is global.
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      sensitive-per-window: ${AUTH_RATE_LIMIT_SENSITIVE:10}
      otp-per-window: ${AUTH_RATE_LIMIT_OTP:5}
      refresh-per-window: ${AUTH_RATE_LIMIT_REFRESH:30}
  security:
    content-security-policy: >-
      ${CONTENT_SECURITY_POLICY:default-src 'none'; frame-ancestors 'none'; base-uri 'none'}
    # [SEC: Wave-1 S6 / Kabir audit H-4] Comma-separated allow-list of trusted reverse-proxy
    # socket addresses. See AuthRateLimitFilter#clientIp — empty by default (fail-safe): with no
    # trusted proxy configured, X-Forwarded-For is ignored entirely and the raw socket peer is
    # used as the rate-limit key. Set to the LB/ingress IP(s) in any real deploy that sits behind
    # a reverse proxy.
    trusted-proxies: ${TRUSTED_PROXIES:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-access-secret-change-in-production-min-32-chars}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-change-in-production-min-32-chars}
    access-expiry-seconds: ${JWT_ACCESS_EXPIRY:900}
    refresh-expiry-seconds: ${JWT_REFRESH_EXPIRY:2592000}
  meera:
    stream:
      # Kabir G2/G6 — distinct signing key from the user access/refresh JWTs. ≤60s TTL scoped
      # per Meera turn (aud=meera-stream); Python verifies this, never the user's access JWT.
      signing-secret: ${MEERA_STREAM_SIGNING_SECRET:dev-meera-stream-secret-change-in-production-min-32-chars}
      stream-token-ttl-seconds: ${MEERA_STREAM_TOKEN_TTL_SECONDS:60}
  internal-service-token:
    # Kabir 2.2/2.4, MF-2, LB-2 — distinct secret from every other key (JWT/stream/R2/Razorpay).
    # Verifies X-Meera-Service-Token (aud=influora-internal, iss=meera-python, exp<=60s) and signs
    # the HMAC request-signature check (X-Meera-Signature) on every /internal/meera/* call.
    signing-secret: ${INTERNAL_SERVICE_TOKEN_SECRET:dev-internal-service-token-secret-change-in-production-min-32-chars}
    hmac-signing-secret: ${INTERNAL_REQUEST_HMAC_SECRET:dev-internal-request-hmac-secret-change-in-production-min-32-chars}
    clock-skew-seconds: ${INTERNAL_REQUEST_CLOCK_SKEW_SECONDS:30}
  # Asymmetric EC/ES256 (P-256) keypair Spring signs BrandSafetyServiceTokenService / StreamTokenService
  # tokens with; the PUBLIC key is served at GET /.well-known/jwks.json for influora-ai to verify.
  # DELIBERATELY no committed default — a private key must never be checked in, not even "dev-only".
  # Supply both PEMs via env in any real deploy (generate with:
  #   openssl ecparam -name prime256v1 -genkey -noout -out jwks.key
  #   openssl ec -in jwks.key -pubout -out jwks.pub
  # then pass the file contents; a single-line env var may use literal \n between PEM lines).
  # Left blank here, SpringJwksKeyService generates a THROWAWAY in-memory keypair on dev boot (loud
  # WARN; tokens don't survive a restart). Outside dev, blank fails closed (SecretsStartupValidator).
  # jwks:
  #   private-key-pem: ${INFLUORA_JWKS_PRIVATE_KEY_PEM:}
  #   public-key-pem: ${INFLUORA_JWKS_PUBLIC_KEY_PEM:}
  #   kid: ${INFLUORA_JWKS_KID:spring-dev-es256-1}
  admin:
    # [SEC: Kabir sign-off gate] AES-256 key for admin TOTP/MFA secret encryption
    # (AdminMfaSecretCipher). Distinct from every other secret. The default below is the committed
    # dev default that SecretsStartupValidator.KNOWN_DEV_DEFAULT_ADMIN_MFA_ENCRYPTION_KEY refuses to
    # boot on outside the dev profile — a real deploy MUST override it via ADMIN_MFA_SECRET_ENCRYPTION_KEY.
    mfa-secret-encryption-key: ${ADMIN_MFA_SECRET_ENCRYPTION_KEY:1FTwBvGuJmF6Q07xw3sMPX0CZEdRWxZx9cIC54HVfUU=}
  msg91:
    enabled: ${MSG91_ENABLED:true}
    auth-key: ${MSG91_AUTH_KEY:REPLACE_WITH_YOUR_MSG91_AUTH_KEY}
    sender-id: ${MSG91_SENDER_ID:INFLRA}
    route: ${MSG91_ROUTE:4}
    widget-id: ${MSG91_WIDGET_ID:REPLACE_WITH_YOUR_MSG91_WIDGET_ID}
    token-auth: ${MSG91_TOKEN_AUTH:REPLACE_WITH_YOUR_MSG91_TOKEN_AUTH}
    email:
      domain: ${MSG91_EMAIL_DOMAIN:mail.influora.com}
      from-email: ${MSG91_FROM_EMAIL:noreply@influora.com}
      from-name: ${MSG91_FROM_NAME:Influora}
      template-id: ${MSG91_EMAIL_TEMPLATE_ID:otpman}
      transactional-template-id: ${MSG91_EMAIL_TRANSACTIONAL_TEMPLATE_ID:REPLACE_WITH_TEMPLATE_ID}
      template-otp-variable: ${MSG91_EMAIL_TEMPLATE_OTP_VARIABLE:otp}
      transactional-link-variable: ${MSG91_EMAIL_TRANSACTIONAL_LINK_VARIABLE:magic_link}
      company-name: ${MSG91_EMAIL_COMPANY_NAME:Influora}
    template:
      otp: ${MSG91_OTP_TEMPLATE_ID:REPLACE_WITH_OTP_TEMPLATE_ID}
      welcome: ${MSG91_WELCOME_TEMPLATE_ID:REPLACE_WITH_WELCOME_TEMPLATE_ID}
  r2:
    account-id: ${R2_ACCOUNT_ID:REPLACE_WITH_YOUR_R2_ACCOUNT_ID}
    access-key-id: ${R2_ACCESS_KEY_ID:REPLACE_WITH_YOUR_R2_ACCESS_KEY}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:REPLACE_WITH_YOUR_R2_SECRET_KEY}
    bucket-name: ${R2_BUCKET_NAME:influora-dev}
    endpoint: ${R2_ENDPOINT:https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com}
    public-url: ${R2_PUBLIC_URL:https://r2.influora.com}
    presign-expiry-seconds: ${R2_PRESIGN_EXPIRY_SECONDS:900}
    max-video-bytes: ${R2_MAX_VIDEO_BYTES:524288000}
  # S7 (2026-07-15, Priya approval) — ClamAvMalwareScanService (@Profile("prod") only; every other
  # profile keeps using NoOpMalwareScanService). Points at the `clamd` service in docker-compose.yml
  # by default; override via env in a real deploy.
  clamav:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    connect-timeout-ms: ${CLAMAV_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CLAMAV_READ_TIMEOUT_MS:15000}
  company:
    # D14 — Influora's own tax identity, used as supplier-of-record on Doc#1 (subscription) and
    # Doc#3 (platform commission) invoices. gstin still defaults to a placeholder here, but
    # CompanyTaxStartupValidator (INV-2) now refuses to boot the prod profile on a blank,
    # still-placeholder, or malformed GSTIN -- non-prod only warns. (No state-code key: it had zero
    # callers -- GstSplitUtil always derives state from the GSTIN itself -- and was deleted as a
    # trap, INV-2.)
    legal-name: ${INFLUORA_LEGAL_NAME:Influora Technologies Pvt. Ltd.}
    gstin: ${INFLUORA_COMPANY_GSTIN:REPLACE_WITH_REAL_GSTIN}
    registered-address: ${INFLUORA_COMPANY_ADDRESS:REPLACE_WITH_REGISTERED_ADDRESS}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_REPLACE_WITH_YOUR_KEY}
    key-secret: ${RAZORPAY_KEY_SECRET:REPLACE_WITH_YOUR_RAZORPAY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:REPLACE_WITH_YOUR_WEBHOOK_SECRET}
    payout-account-number: ${RAZORPAYX_ACCOUNT_NUMBER:REPLACE_WITH_YOUR_RAZORPAYX_ACCOUNT}
    api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
    payout-api-base-url: ${RAZORPAYX_API_BASE_URL:https://api.razorpay.com/v1}
    platform-fee-percent: ${PLATFORM_FEE_PERCENT:15.00}
  # Brand-safety scoring feature flag (Priya ruling). OFF by default: ScoreCalculationJob then never
  # calls BrandSafetyScoreService and leaves creator_scores.brand_safety_score / garm_flags /
  # content_sentiment NULL on every row (its pre-existing behaviour). When turned on, EACH scored
  # creator triggers a chunked LLM classification call to the influora-ai (Python) service
  # (influora.brand-safety-ai.base-url), so max-creators-per-run caps how many creators incur that
  # real-money fan-out per daily run (the job prioritises missing/stalest brand-safety scores so
  # coverage rotates). See application-prod.yml for a commented enable-with-cap example.
  brand-safety-scoring:
    enabled: ${BRAND_SAFETY_SCORING_ENABLED:false}
    max-creators-per-run: ${BRAND_SAFETY_SCORING_MAX_CREATORS_PER_RUN:100}
