spring:
  application:
    name: influora-api
  datasource:
    # [SEC: Wave-1 S1-DB/D7] root/root + useSSL=false is a zero-config convenience default for the
    # local docker-compose MySQL ONLY (see ../docker-compose.yml: MYSQL_ROOT_PASSWORD: root) — it
    # is NOT reachable in a real deploy: application-prod.yml overrides these three keys with no
    # default (so spring.profiles.active=prod fails to boot without real
    # SPRING_DATASOURCE_{URL,USERNAME,PASSWORD} env vars), and SecretsStartupValidator additionally
    # fails closed outside dev (influora.env) if these still resolve to root/root or useSSL=false,
    # independent of whether the prod Spring profile was actually activated.
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/Influora_AI?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:root}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE:10}
  # MSG91's SMTP relay — Msg91EmailClient sends through this JavaMailSender bean rather than
  # MSG91's Email API v5 (both v5 credentials returned 401 when live-tested against
  # control.msg91.com; SMTP is the working alternative MSG91 also runs, under separate
  # credentials). No default host: leaving SMTP_HOST unset means Spring Boot's
  # MailSenderAutoConfiguration never creates a JavaMailSender bean at all, which
  # Msg91EmailClient's ObjectProvider<JavaMailSender> handles the same way as "not configured".
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          # Port 587 = STARTTLS (default). If the host provider blocks outbound 587 -- most VPS
          # providers drop outbound SMTP by default as anti-spam, which surfaces as
          # SocketTimeoutException "Connect timed out", NOT a refusal -- switch to implicit TLS
          # on 465 instead: SMTP_PORT=465, SMTP_SSL_ENABLE=true, SMTP_STARTTLS_ENABLE=false.
          # Both flags are env-driven so that fallback needs no rebuild.
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          ssl:
            enable: ${SMTP_SSL_ENABLE:false}
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Meera G-1 — numeric migrations (V41-V64) sort BELOW the timestamp-based ones
    # (V20260709155921__*, etc.) that were added after them chronologically. On any environment
    # already migrated up to one of those timestamp versions, Flyway's default (out-of-order=false)
    # would silently SKIP the lower-numbered V50-V64 migrations instead of applying them. Safe,
    # non-destructive: Flyway still runs every pending migration in version order, it just no
    # longer requires new versions to be strictly greater than the highest applied version.
    out-of-order: true
  servlet:
    multipart:
      # Kabir H-1 — no multipart config existed, so uploads were capped at Spring's 1MB default.
      # Matches the deliverable upload spec (MultipartConfigTest expects 500MB/1GB).
      max-file-size: 500MB
      max-request-size: 1GB

server:
  port: ${SERVER_PORT:8080}
  # [SEC: Kabir CR-11 endpoint red-team, Blocker-1] `native`, NOT `framework`. This reverses the
  # Wave-1 S6 guidance that used to sit here ("never set to `native` ... use `framework` if/when a
  # real deploy needs it"), and the deploys had since set `framework`. That combination was
  # exploitable:
  #
  #   `framework` installs Spring's ForwardedHeaderFilter, which (a) takes the LEFT-MOST
  #   X-Forwarded-For entry — the one a client can freely spoof, since Caddy APPENDS the true peer
  #   rather than replacing the header — (b) performs no trusted-proxy validation whatsoever, and
  #   (c) STRIPS the X-Forwarded-* headers from the wrapped request. It runs at HIGHEST_PRECEDENCE,
  #   ahead of the Security chain at -100. So by the time AuthRateLimitFilter ran, getRemoteAddr()
  #   was already attacker-controlled AND the raw header was gone — no code downstream could
  #   recover the real peer. Every IP-keyed bucket, including login brute-force, was defeated by
  #   sending a different XFF per request. AdminAuditLogService recorded the same forged value as
  #   a forensic record.
  #
  # The old comment's premise — that `native` is "unmanaged by our trusted-proxy allow-list" — was
  # backwards. Tomcat's RemoteIpValve HAS an allow-list (`internal-proxies`), and it walks XFF
  # RIGHT-TO-LEFT skipping known proxies, so it lands on the entry Caddy actually appended and a
  # client-prepended entry can never win. `framework` is the one with no allow-list at all.
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:native}
  tomcat:
    # [SEC: Kabir CR-11 red-team, H-2] Bound the request-BODY read. `connection-timeout` (20s
    # default) covers reading request HEADERS only, and `disable-upload-timeout` defaults to TRUE,
    # which means no read timeout is applied during the body read at all. Nothing here previously
    # set any `server.tomcat.*` property, so both defaults stood.
    #
    # Consequence: a request that trickles its body holds one Tomcat thread out of a pool of 200 for
    # as long as it likes. 200 slow connections stop the entire API — login, deals, webhooks, all of
    # it. Caddy does not help: it streams the body upstream with no client read timeout, and its
    # `read_timeout` applies to reading the upstream RESPONSE, not the client's upload.
    #
    # `POST /client-errors` is where this became cheap to reach — unauthenticated, no HMAC (unlike
    # /webhooks/*), no credentials (unlike /auth/*) — but the exposure belongs to every POST that
    # reads a body, which is why the fix is global rather than per-endpoint.
    #
    # 15s is generous for every legitimate request this API serves EXCEPT deliverable upload, which
    # is why the value is overridable: a large upload over a slow mobile link is the one real case
    # that needs longer, and it should be raised deliberately rather than discovered in production.
    disable-upload-timeout: false
    connection-upload-timeout: ${TOMCAT_UPLOAD_TIMEOUT_MS:15000}
    remoteip:
      # Tomcat's default already covers RFC1918 + loopback, which is every Docker bridge range this
      # stack uses, so the out-of-the-box value is correct here and needs no per-deploy tuning.
      # Overridable for a topology with a proxy outside those ranges. It is a REGEX, not a list —
      # this is why the old comma-separated `influora.security.trusted-proxies` could not simply be
      # handed to it.
      internal-proxies: ${TOMCAT_INTERNAL_PROXIES:10\.\d{1,3}\.\d{1,3}\.\d{1,3}|192\.168\.\d{1,3}\.\d{1,3}|169\.254\.\d{1,3}\.\d{1,3}|127\.\d{1,3}\.\d{1,3}\.\d{1,3}|172\.1[6-9]{1}\.\d{1,3}\.\d{1,3}|172\.2[0-9]{1}\.\d{1,3}\.\d{1,3}|172\.3[0-1]{1}\.\d{1,3}\.\d{1,3}|0:0:0:0:0:0:0:1|::1}
  servlet:
    context-path: /api/v1

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

influora:
  # W3-1 — base URL of the SPA, used to build absolute links embedded in transactional emails
  # (currently: password-reset link). Same default dev origin as influora.cors.allowed-origins.
  web-base-url: ${INFLUORA_WEB_BASE_URL:http://localhost:5173}
  # Public origin of THIS API (not the SPA). Msg91EmailClient appends
  # `server.servlet.context-path` + /notifications/unsubscribe-link to it when building the
  # one-click unsubscribe URL embedded in transactional emails.
  #
  # Added 2026-07-26: `@Value("${influora.api.public-url}")` (Msg91EmailClient) had NO default and
  # the key was defined nowhere, so constructing the msg91EmailClient bean threw
  # "Could not resolve placeholder 'influora.api.public-url'" and the whole Spring context failed
  # to load. That is a boot-blocker in any environment that does not set the env var — it surfaced
  # as all three DatabaseConstraintIntegrationTest cases failing in Backend CI, which was the only
  # thing booting a real context. Defaulted the same way web-base-url is.
  api:
    public-url: ${INFLUORA_API_PUBLIC_URL:http://localhost:8080}
  # Brand review clock (owner's ruling, 2026-09-21). A brand has 3 working days to approve,
  # reject or ask for a revision on a submitted draft, and 2 working days on each resubmission.
  # If it does none of those, BrandReviewSlaEscalationJob hands the deliverable to the Influora
  # team as a support ticket. It is NEVER auto-approved and NEVER auto-paid - no value of these
  # settings can make this feature move money.
  #
  # Working days are Monday to Friday (com.influora.common.WorkingDays - the one definition).
  # The third number in the rule, "at most 2 revision rounds", is NOT here: it is a per-deal
  # value on the collaboration (Collaboration.maxRevisions, default 2) already enforced by
  # BrandDeliverableService#requestRevision.
  review-sla:
    escalation-enabled: ${INFLUORA_REVIEW_SLA_ESCALATION_ENABLED:true}
    first-review-working-days: ${INFLUORA_REVIEW_SLA_FIRST_DAYS:3}
    revision-review-working-days: ${INFLUORA_REVIEW_SLA_REVISION_DAYS:2}
    # Bound per run, not a filter - the remainder is picked up by the next run. Keeps the first
    # run after deploy (which sees every draft a brand has ever left sitting) from arriving in
    # the team's queue all at once.
    batch-limit: ${INFLUORA_REVIEW_SLA_BATCH_LIMIT:200}
    # Hourly at :05, IST. A deadline expiring at midnight reaches the queue the same morning.
    cron: ${INFLUORA_REVIEW_SLA_CRON:0 5 * * * *}
  escrow:
    release-gate:
      # EscrowService#assertReleaseConditionSatisfied — the gate that stops secured funds being
      # released before the creator's post is live.
      #
      # ON by default since 2026-09-21. It was OFF by default before that, and not by a flag:
      # cutover-instant shipped BLANK, and a blank cutover makes isPostCutover() answer false for
      # every milestone, so the gate was never consulted and releases failed OPEN. Turning it off
      # now requires setting `enabled: false` here (or INFLUORA_ESCROW_RELEASE_GATE_ENABLED=false),
      # which logs a warning at boot naming what that permits.
      enabled: ${INFLUORA_ESCROW_RELEASE_GATE_ENABLED:true}
      # CR-51 step 2 cutover. Milestones created AFTER this instant are gated; milestones created
      # at/before it keep failing open unconditionally, so deals already in flight when the gate
      # was switched on are unaffected. Deliberately NOT derived from "has deliverables" — see the
      # javadoc on assertReleaseConditionSatisfied. Blank or unparseable WHILE ENABLED no longer
      # disables the gate: it fails CLOSED at 1970-01-01T00:00:00Z (every milestone gated) and
      # logs an ERROR.
      #
      # The default below is the day the gate was switched on, expressed in UTC. It must stay in
      # the PAST: a cutover in the future puts every milestone created today back on the fail-open
      # side of isPostCutover(...), which is the inert state this whole change exists to end. The
      # first value tried here, 2026-09-21T00:00:00Z, was still several hours in the future when
      # the change was made from IST — EscrowReleaseAfterLivePostTest#shippedDefaultsLeaveTheGateOn
      # catches exactly that.
      cutover-instant: ${INFLUORA_ESCROW_RELEASE_GATE_CUTOVER_INSTANT:2026-09-20T00:00:00Z}
  auth:
    require-email-verification: true
    # ON by default since 2026-09-12. When true, register REFUSES an email that has not
    # completed the OTP challenge (brandRegister/creatorRegister -> requireVerifiedEmail), and
    # the register pages render EmailOtpGate -- the client learns this from GET /public/config,
    # so the server flag and the UI can never disagree.
    #
    # This makes MSG91 delivery a HARD DEPENDENCY of registration: with MSG91 unconfigured or
    # down, sendOtp throws 503 EMAIL_DELIVERY_FAILED and NOBODY can sign up at all. That is why
    # this stays env-overridable instead of a literal true -- REQUIRE_EMAIL_OTP_BEFORE_REGISTER=false
    # is the kill switch for an MSG91 outage, and it takes effect without rebuilding the image.
    #
    # Do NOT set it false while require-email-verification above is true unless you understand
    # F-0601: that combination stamps every new account PENDING_VERIFICATION with no OTP ever
    # sent, and the account bricks at its second login.
    require-email-otp-before-register: ${REQUIRE_EMAIL_OTP_BEFORE_REGISTER:true}
    otp-length: 6
    # Kabir A1/B4 — refresh token lives only in this HttpOnly cookie, never in JSON/localStorage.
    # secure MUST be true on any HTTPS deploy; false only for local http dev.
    refresh-cookie:
      name: ${AUTH_REFRESH_COOKIE_NAME:influora_refresh}
      secure: ${AUTH_REFRESH_COOKIE_SECURE:false}
      same-site: ${AUTH_REFRESH_COOKIE_SAMESITE:Strict}
      path: ${AUTH_REFRESH_COOKIE_PATH:/api/v1/auth}
    # Kabir B3 — per-instance throttle on the unauthenticated auth surface. Move to a shared store
    # (Redis) or the edge when horizontally scaled so the limit is global.
    rate-limit:
      enabled: ${AUTH_RATE_LIMIT_ENABLED:true}
      window-seconds: ${AUTH_RATE_LIMIT_WINDOW_SECONDS:60}
      sensitive-per-window: ${AUTH_RATE_LIMIT_SENSITIVE:10}
      otp-per-window: ${AUTH_RATE_LIMIT_OTP:5}
      refresh-per-window: ${AUTH_RATE_LIMIT_REFRESH:30}
  security:
    content-security-policy: >-
      ${CONTENT_SECURITY_POLICY:default-src 'none'; frame-ancestors 'none'; base-uri 'none'}
    # [SEC: Kabir CR-11 XFF re-review, H-1] `trusted-proxies` is GONE. It used to live here telling
    # operators to "set to the LB/ingress IP(s) in any real deploy" and cross-referencing
    # AuthRateLimitFilter#clientIp, which no longer reads it. Trusted-proxy validation now lives in
    # `server.tomcat.remoteip.internal-proxies` above. Deleting only the Java half left the half an
    # operator actually reads to understand this system's posture — precisely the CR-33 artefact the
    # fix commit invoked as its reason for deleting rather than leaving inert.
    # The `TRUSTED_PROXIES` env var is still passed by deploy/hostinger/*.yml and is inert; it stays
    # there so a rollback to an older image does not lose it. That reasoning does not extend to this
    # binding, which is why this one is removed and that one is not.
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    access-secret: ${JWT_ACCESS_SECRET:dev-access-secret-change-in-production-min-32-chars}
    refresh-secret: ${JWT_REFRESH_SECRET:dev-refresh-secret-change-in-production-min-32-chars}
    access-expiry-seconds: ${JWT_ACCESS_EXPIRY:900}
    refresh-expiry-seconds: ${JWT_REFRESH_EXPIRY:2592000}
    # F-0551 — refresh-token lifetime when the login did NOT set rememberMe=true. 24h; see
    # JwtProperties' javadoc on refreshExpiryNotRememberedSeconds for the reasoning.
    refresh-expiry-not-remembered-seconds: ${JWT_REFRESH_EXPIRY_NOT_REMEMBERED:86400}
  meera:
    # Priya gate review defect 4 — Phase A rollback flag (MeeraCreatorFeatureProperties). true
    # (on) by default; set MEERA_CREATOR_ENABLED=false to 404 every CREATOR-audience Meera
    # surface (agent-preferences, consent, /creator/meera/**, public verified) without a code
    # rollback.
    creator-enabled: ${MEERA_CREATOR_ENABLED:true}
    stream:
      # Kabir G2/G6 — distinct signing key from the user access/refresh JWTs. ≤60s TTL scoped
      # per Meera turn (aud=meera-stream); Python verifies this, never the user's access JWT.
      signing-secret: ${MEERA_STREAM_SIGNING_SECRET:dev-meera-stream-secret-change-in-production-min-32-chars}
      stream-token-ttl-seconds: ${MEERA_STREAM_TOKEN_TTL_SECONDS:60}
  # [Ash AI-review 2026-07-23] MeeraVoiceAiClient (Sarvam TTS/STT proxy) @Value default is
  # http://localhost:8000. Only application-prod.yml set influora.voice-ai.base-url, so on ANY
  # non-prod deploy (incl. the dev-profile IP test box) every /meera/voice/speak call hit localhost
  # inside the api container -> HttpHostConnectException -> SpeakResult.fallback() -> the browser's
  # robotic SpeechSynthesis instead of Sarvam. Resolve here (default profile, so dev inherits it):
  # explicit VOICE_AI_BASE_URL wins; else reuse MEERA_CHAT_AI_BASE_URL (already set to the AI
  # container on every containerized deploy — voice is part of Meera and lives in the same service);
  # else localhost for a bare local run. application-prod.yml still overrides with a no-default
  # ${VOICE_AI_BASE_URL} (fail-fast), so prod behavior is unchanged.
  voice-ai:
    base-url: ${VOICE_AI_BASE_URL:${MEERA_CHAT_AI_BASE_URL:http://localhost:8000}}
  # [Ash AI-review 2026-07-23] Same class of bug as voice-ai above, for the other three
  # server-side AI clients. Their base-urls were mapped ONLY in application-prod.yml, so on the
  # dev-profile deploy the boot-time validator warned "…base-url still points at localhost" and
  # every Spring->influora-ai call (analyze-site classify, brand-safety scoring, trendspark)
  # failed with a transport error to localhost inside the api container. The env vars
  # (BRAND_SAFETY_AI_BASE_URL / TRENDSPARK_AI_BASE_URL / MEERA_CHAT_AI_BASE_URL /
  # ANALYZE_SITE_AI_BASE_URL) are already set to the AI container on every containerized deploy —
  # they just weren't read in dev. Bind them here (default profile) so dev inherits them; prod's
  # application-prod.yml still overrides. NOTE: meera-chat TEXT replies were unaffected because the
  # browser streams them direct via Caddy /meera/* (SSE), not through MeeraChatAiClient.
  brand-safety-ai:
    base-url: ${BRAND_SAFETY_AI_BASE_URL:http://localhost:8000}
  trendspark-ai:
    base-url: ${TRENDSPARK_AI_BASE_URL:http://localhost:8000}
  meera-chat-ai:
    base-url: ${MEERA_CHAT_AI_BASE_URL:http://localhost:8000}
  analyze-site-ai:
    base-url: ${ANALYZE_SITE_AI_BASE_URL:http://localhost:8000}
  # Fifth influora-ai client, added with the Creator AI Co-pilot. Same localhost-default trap the
  # four above document: CreatorSuggestionAiProperties defaults base-url to http://localhost:8000,
  # which inside the api container reaches nothing. CreatorNudgeService.callAiSafely swallows the
  # failure and falls back to template copy, so a missed override degrades the suggestion wording
  # silently rather than erroring — which is exactly why it needs the placeholder and the
  # SecretsStartupValidator check its siblings already have.
  creator-copilot-ai:
    base-url: ${CREATOR_COPILOT_AI_BASE_URL:http://localhost:8000}
  internal-service-token:
    # Kabir 2.2/2.4, MF-2, LB-2 — distinct secret from every other key (JWT/stream/R2/Razorpay).
    # Verifies X-Meera-Service-Token (aud=influora-internal, iss=meera-python, exp<=60s) and signs
    # the HMAC request-signature check (X-Meera-Signature) on every /internal/meera/* call.
    signing-secret: ${INTERNAL_SERVICE_TOKEN_SECRET:dev-internal-service-token-secret-change-in-production-min-32-chars}
    hmac-signing-secret: ${INTERNAL_REQUEST_HMAC_SECRET:dev-internal-request-hmac-secret-change-in-production-min-32-chars}
    clock-skew-seconds: ${INTERNAL_REQUEST_CLOCK_SKEW_SECONDS:30}
  # Wave C task C3 — the service token Spring MINTS for POST /internal/brand-safety on influora-ai
  # (Spring -> Python), the OPPOSITE direction from internal-service-token above. Distinct secret
  # from every other credential surface, same blast-radius-isolation convention (Kabir guardrail 6).
  #
  # This line was missing until now. The property had no yaml entry at all, so
  # BRAND_SAFETY_SERVICE_TOKEN_SECRET — the env var named in BrandSafetyServiceTokenProperties'
  # javadoc, in wiki/decisions/2026-07-07-spring-python-service-auth-jwks-gap.md, and actually set
  # on the deploy box — bound to nothing. The value fell back to the POJO's "" and every non-dev
  # boot died in SecretsStartupValidator ("missing or shorter than 32 bytes") while dev stayed
  # warn-only. The default below is the one KNOWN_DEV_DEFAULTS has always expected to match.
  #
  # Local dev: must equal influora-ai's DEV_SHARED_JWT_SECRET byte-for-byte (its HS256 fallback).
  # Prod: influora-ai verifies via Spring's JWKS, so only length/distinctness matter here.
  brand-safety-service-token:
    signing-secret: ${BRAND_SAFETY_SERVICE_TOKEN_SECRET:dev-brand-safety-service-token-secret-change-in-production-min-32-chars}
  # Asymmetric EC/ES256 (P-256) keypair Spring signs BrandSafetyServiceTokenService / StreamTokenService
  # tokens with; the PUBLIC key is served at GET /.well-known/jwks.json for influora-ai to verify.
  # DELIBERATELY no committed default — a private key must never be checked in, not even "dev-only".
  # Supply both PEMs via env in any real deploy (generate with:
  #   openssl ecparam -name prime256v1 -genkey -noout -out jwks.key
  #   openssl ec -in jwks.key -pubout -out jwks.pub
  # then pass the file contents; a single-line env var may use literal \n between PEM lines).
  # Left blank here, SpringJwksKeyService generates a THROWAWAY in-memory keypair on dev boot (loud
  # WARN; tokens don't survive a restart). Outside dev, blank fails closed (SecretsStartupValidator).
  # jwks:
  #   private-key-pem: ${INFLUORA_JWKS_PRIVATE_KEY_PEM:}
  #   public-key-pem: ${INFLUORA_JWKS_PUBLIC_KEY_PEM:}
  #   kid: ${INFLUORA_JWKS_KID:spring-dev-es256-1}
  admin:
    # [SEC: Kabir sign-off gate] AES-256 key for admin TOTP/MFA secret encryption
    # (AdminMfaSecretCipher). Distinct from every other secret. The default below is the committed
    # dev default that SecretsStartupValidator.KNOWN_DEV_DEFAULT_ADMIN_MFA_ENCRYPTION_KEY refuses to
    # boot on outside the dev profile — a real deploy MUST override it via ADMIN_MFA_SECRET_ENCRYPTION_KEY.
    mfa-secret-encryption-key: ${ADMIN_MFA_SECRET_ENCRYPTION_KEY:1FTwBvGuJmF6Q07xw3sMPX0CZEdRWxZx9cIC54HVfUU=}
    # T-CREATORCONNECT-0902 — recipient for admin.creator_connection_requested. Blank (the
    # default) means NotificationListener logs a WARN and skips sending rather than erroring —
    # nothing here ever throws for a missing address, same fail-open-for-notification discipline
    # as every other optional recipient config in this file.
    notification-email: ${ADMIN_NOTIFICATION_EMAIL:}
    # [Kabir M-3] Throttle on POST /admin/campaigns/{campaignId}/coupons (AuthRateLimitFilter's
    # "admin-coupon-issue" bucket). RBAC decides who may mint discount codes; this decides how
    # many. Keyed by admin identity, own hourly window -- the shared 60s auth window is meaningless
    # for an action nobody performs in bursts. Surfaced here rather than left as a bare @Value
    # default so an operator can raise it for a genuine bulk-issuance need via env var, instead of
    # needing a rebuild (or, worse, concluding the bound has to be deleted).
    coupon-issue-rate-limit-per-window: ${ADMIN_COUPON_ISSUE_RATE_LIMIT:30}
    coupon-issue-rate-limit-window-seconds: ${ADMIN_COUPON_ISSUE_RATE_LIMIT_WINDOW_SECONDS:3600}
  # Q3.5 (T-CREATORCONNECT-0902) -- per-workspace daily cap on NEW/reopened
  # POST /creators/external/{id}/connect requests (ExternalCreatorService#enforceDailyConnectCap);
  # each one fires an admin.creator_connection_requested email, so this bounds how many a single
  # workspace can trigger in a rolling 24h window. <= 0 disables the cap.
  creator-connect:
    daily-cap-per-workspace: ${CREATOR_CONNECT_DAILY_CAP_PER_WORKSPACE:50}
  # CreatorConnectNudgeJob -- lifecycle email to creators who registered but never connected a
  # Meta account. Disabled by default ON PURPOSE: it mails real people on a schedule, so enabling
  # it is a deliberate deployment act, not a side effect of shipping the code.
  creator-connect-nudge:
    enabled: ${CREATOR_CONNECT_NUDGE_ENABLED:false}
    # Floors the eligibility query. Without it the first enabled run selects every un-connected
    # creator ever registered and mails the whole back catalogue in one batch.
    registered-within-days: ${CREATOR_CONNECT_NUDGE_REGISTERED_WITHIN_DAYS:30}
    batch-limit: ${CREATOR_CONNECT_NUDGE_BATCH_LIMIT:200}
    # Cron is evaluated in Asia/Kolkata (see the job) -- this one lands in a person's inbox.
    cron: ${CREATOR_CONNECT_NUDGE_CRON:0 30 9 * * *}
  # T-ADMINMAIL-0903 -- admin custom email send abuse controls #1/#2. Both are persisted
  # (admin_email_campaigns), not in-memory, so a restart never resets them -- see
  # AdminCustomEmailService class javadoc.
  admin-custom-email:
    recipient-cap: ${ADMIN_CUSTOM_EMAIL_RECIPIENT_CAP:5000}
    min-interval-minutes: ${ADMIN_CUSTOM_EMAIL_MIN_INTERVAL_MINUTES:10}
    # A5 fix (round 5, REVIEW-R4.md): preview() rate limit -- deliberately in-memory, NOT
    # persisted like the two above (see AdminCustomEmailService#enforcePreviewRateLimit's
    # javadoc for why that's fine for this one). Resets on restart; that's acceptable here.
    preview-min-interval-millis: ${ADMIN_CUSTOM_EMAIL_PREVIEW_MIN_INTERVAL_MILLIS:2000}
  msg91:
    enabled: ${MSG91_ENABLED:true}
    auth-key: ${MSG91_AUTH_KEY:REPLACE_WITH_YOUR_MSG91_AUTH_KEY}
    sender-id: ${MSG91_SENDER_ID:INFLRA}
    route: ${MSG91_ROUTE:4}
    widget-id: ${MSG91_WIDGET_ID:REPLACE_WITH_YOUR_MSG91_WIDGET_ID}
    token-auth: ${MSG91_TOKEN_AUTH:REPLACE_WITH_YOUR_MSG91_TOKEN_AUTH}
    email:
      domain: ${MSG91_EMAIL_DOMAIN:mail.influora.in}
      from-email: ${MSG91_FROM_EMAIL:noreply@mail.influora.in}
      from-name: ${MSG91_FROM_NAME:Influora}
      template-id: ${MSG91_EMAIL_TEMPLATE_ID:otpman}
      transactional-template-id: ${MSG91_EMAIL_TRANSACTIONAL_TEMPLATE_ID:REPLACE_WITH_TEMPLATE_ID}
      template-otp-variable: ${MSG91_EMAIL_TEMPLATE_OTP_VARIABLE:otp}
      transactional-link-variable: ${MSG91_EMAIL_TRANSACTIONAL_LINK_VARIABLE:magic_link}
      company-name: ${MSG91_EMAIL_COMPANY_NAME:Influora}
    template:
      otp: ${MSG91_OTP_TEMPLATE_ID:REPLACE_WITH_OTP_TEMPLATE_ID}
      welcome: ${MSG91_WELCOME_TEMPLATE_ID:REPLACE_WITH_WELCOME_TEMPLATE_ID}
  notification:
    # Signs the one-click unsubscribe link embedded in outbound emails (UnsubscribeTokenService).
    # Distinct from every other secret in the system, same blast-radius-isolation convention as
    # influora.internal-service-token.* below.
    unsubscribe-signing-secret: ${UNSUBSCRIBE_SIGNING_SECRET:change-me-unsubscribe-signing-secret-min-32-chars}
  festival:
    # T-FESTIVALBOX-0905 — salts the SHA-256 of the client address that FestivalEnquiryService
    # stores as festival_enquiries.source_ip_hash to throttle the public form. Without a salt the
    # IPv4 space is small enough to enumerate offline, so a bare hash would still confirm a guessed
    # address. Distinct from every other secret in the system, same blast-radius-isolation
    # convention as influora.notification.unsubscribe-signing-secret above.
    #
    # A rotated salt does NOT lose data: it only makes pre-rotation rows uncountable by the
    # throttle, which self-heals once the 1-hour window passes.
    ip-hash-salt: ${FESTIVAL_IP_HASH_SALT:change-me-festival-ip-hash-salt-min-32-chars}
  r2:
    account-id: ${R2_ACCOUNT_ID:REPLACE_WITH_YOUR_R2_ACCOUNT_ID}
    access-key-id: ${R2_ACCESS_KEY_ID:REPLACE_WITH_YOUR_R2_ACCESS_KEY}
    secret-access-key: ${R2_SECRET_ACCESS_KEY:REPLACE_WITH_YOUR_R2_SECRET_KEY}
    bucket-name: ${R2_BUCKET_NAME:influora-dev}
    endpoint: ${R2_ENDPOINT:https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com}
    public-url: ${R2_PUBLIC_URL:https://r2.influora.com}
    presign-expiry-seconds: ${R2_PRESIGN_EXPIRY_SECONDS:900}
    max-video-bytes: ${R2_MAX_VIDEO_BYTES:524288000}
  # S7 (2026-07-15, Priya approval) — ClamAvMalwareScanService (@Profile("prod") only; every other
  # profile keeps using NoOpMalwareScanService). Points at the `clamd` service in docker-compose.yml
  # by default; override via env in a real deploy.
  clamav:
    host: ${CLAMAV_HOST:localhost}
    port: ${CLAMAV_PORT:3310}
    connect-timeout-ms: ${CLAMAV_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${CLAMAV_READ_TIMEOUT_MS:15000}
  company:
    # D14 — Influora's own tax identity, used as supplier-of-record on Doc#1 (subscription) and
    # Doc#3 (platform commission) invoices. gstin still defaults to a placeholder here, but
    # CompanyTaxStartupValidator (INV-2) now refuses to boot the prod profile on a blank,
    # still-placeholder, or malformed GSTIN -- non-prod only warns. (No state-code key: it had zero
    # callers -- GstSplitUtil always derives state from the GSTIN itself -- and was deleted as a
    # trap, INV-2.)
    legal-name: ${INFLUORA_LEGAL_NAME:Influora Digital Private Limited}
    gstin: ${INFLUORA_COMPANY_GSTIN:REPLACE_WITH_REAL_GSTIN}
    registered-address: ${INFLUORA_COMPANY_ADDRESS:REPLACE_WITH_REGISTERED_ADDRESS}
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_REPLACE_WITH_YOUR_KEY}
    key-secret: ${RAZORPAY_KEY_SECRET:REPLACE_WITH_YOUR_RAZORPAY_SECRET}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:REPLACE_WITH_YOUR_WEBHOOK_SECRET}
    payout-account-number: ${RAZORPAYX_ACCOUNT_NUMBER:REPLACE_WITH_YOUR_RAZORPAYX_ACCOUNT}
    api-base-url: ${RAZORPAY_API_BASE_URL:https://api.razorpay.com/v1}
    payout-api-base-url: ${RAZORPAYX_API_BASE_URL:https://api.razorpay.com/v1}
    platform-fee-percent: ${PLATFORM_FEE_PERCENT:15.00}
  # Meta Graph API (Instagram/Facebook) OAuth + insights credentials -> MetaApiProperties
  # (@ConfigurationProperties prefix "influora.meta"). One platform-wide Meta app, same for every
  # brand/creator; the per-user OAuth access tokens obtained after connecting are stored ENCRYPTED
  # in the DB by MetaTokenStorage, not here. Placeholder defaults follow the msg91/r2/razorpay
  # convention above — real values via env on any deploy; dev literals in application-dev.yml.
  meta:
    # Blank defaults (NOT a REPLACE_WITH placeholder): MetaApiProperties.isConfigured() is just
    # "app-id AND app-secret both non-blank", and it's the gate that decides whether Meta OAuth is
    # live. A non-blank placeholder would flip isConfigured() to true with no real credentials set,
    # firing real Graph API calls with garbage — so Meta must stay OFF by default (leave unset
    # unless used). Supply real values via env (prod) or application-dev.yml (dev).
    app-id: ${META_APP_ID:}
    app-secret: ${META_APP_SECRET:}
    # Meta redirects the BROWSER here, so this must be the SPA route that completes the connect —
    # NOT an API path. Verified live 2026-09-12: pointed at /api/v1/meta/oauth/callback, every
    # connect returned UNAUTHENTICATED, because that endpoint needs an Authorization header and a
    # top-level navigation from facebook.com carries none. Derived from web-base-url like
    # influora.shopify.redirect-uri below, so a deploy that sets nothing still gets a value that
    # works. MetaRedirectUri.resolve() repeats this default in code, deliberately: both Utho
    # compose files forward `${META_REDIRECT_URI}` bare, an unset host var arrives as set-but-EMPTY,
    # and a yaml default only applies when the property is ABSENT (the F-0390 class documented in
    # deploy/hostinger/docker-compose.hostinger.yml). Without the code-side fallback this line is
    # decorative on exactly the deploys that need it.
    redirect-uri: ${META_REDIRECT_URI:${influora.web-base-url}/creator/settings/meta/callback}
    # T-IGLOGIN-0820 — Business Login for Instagram (no Facebook Page required). Distinct app
    # credentials from the Facebook pair above; blank keeps that path off, same convention.
    instagram-app-id: ${META_INSTAGRAM_APP_ID:}
    instagram-app-secret: ${META_INSTAGRAM_APP_SECRET:}
    # One SPA route serves both auth paths — the backend recovers which one from the state token —
    # so this defaults to the same place. It is a separate property because the Instagram app's
    # dashboard keeps its own Valid OAuth Redirect URIs list, not because the URL differs.
    instagram-redirect-uri: ${META_INSTAGRAM_REDIRECT_URI:${influora.web-base-url}/creator/settings/meta/callback}
    graph-api-version: ${META_GRAPH_API_VERSION:v25.0}
    # F-0479 — MetricsPollingJob's per-post leg: fetch recent media + insights and write
    # media_metrics. ON by default; with it off that table has NO writer and every creator stays
    # permanently unscored (F-0478), which is the state this exists to end, not to preserve.
    # It is a kill switch for the one real cost — roughly 1 + 25 extra Graph calls per creator per
    # 6-hour cycle — not a rollout gate. Bound here rather than left to relaxed binding so the env
    # var name actually appears in this file; a name that appears only in javadoc binds to nothing.
    media-metrics-enabled: ${META_MEDIA_METRICS_ENABLED:true}
    # [SEC: Kabir sign-off gate] DISTINCT AES-256 secret from every other key; must decode to
    # exactly 32 bytes (enforced in MetaTokenStorage). No committed default here — application-dev.yml
    # supplies a throwaway dev value; a real deploy MUST set META_TOKEN_ENCRYPTION_KEY.
    token-encryption-key: ${META_TOKEN_ENCRYPTION_KEY:}
    # T-CREATORCONNECT-0902 — CreatorMarketplaceClient gate. OFF by default: the
    # instagram_creator_marketplace_discovery scope this needs cannot even be submitted for App
    # Review yet (wiki/decisions/2026-09-02-what-we-need.md §1.2/§4.2), so a real deploy leaves
    # this false and ExternalCreatorService serves the external_creators table (Business Discovery
    # + admin import) instead. Flipping it true with no usable Page token still degrades cleanly —
    # ExternalCreatorService logs at INFO and falls back, never fakes Marketplace data.
    creator-marketplace:
      enabled: ${META_CREATOR_MARKETPLACE_ENABLED:false}
    # Q1.3 (T-CREATORCONNECT-0902) — Influora-owned IG Business system caller for Business
    # Discovery, preferred ahead of borrowing a live creator's own token (see MetaApiProperties
    # javadoc). Blank by default; ExternalCreatorService falls back to the creator-token path
    # exactly as before when either is unset.
    system-ig-user-id: ${META_SYSTEM_IG_USER_ID:}
    system-ig-access-token: ${META_SYSTEM_IG_ACCESS_TOKEN:}
  # AES-256 token/PII encryption keys that had NO entry in this file at all, so the only way to
  # supply them was Spring's relaxed binding on the @ConfigurationProperties prefix — the env var
  # name appeared in no yaml, no .env.example and no deploy doc. Each of these beans is an
  # unconditional @Service whose constructor throws on a blank key (AesGcmCipher#decodeKey and the
  # per-class copies in MetaTokenStorage / ShopifyTokenStorage / WooCommerceIntegrationService /
  # ConversionWebhookSecretService), so a deploy missing any one dies at bean init — one bean per
  # restart, with no single startup report naming them the way SecretsStartupValidator does.
  #
  # Same convention as meta.token-encryption-key above: deliberately NO committed default.
  # application-dev.yml (V0-1) supplies throwaway dev-profile values and profile-specific config
  # wins over this file, so the dev profile is unaffected; a real deploy MUST set these.
  #
  # Names are the relaxed-binding form already used by deploy/utho/generate-env.sh and every
  # docker-compose file, kept byte-identical so no live box has to be re-keyed.
  pii:
    email-phone-encryption-key: ${INFLUORA_PII_EMAILPHONEENCRYPTIONKEY:}
    bank-encryption-key: ${INFLUORA_PII_BANKENCRYPTIONKEY:}
  shopify:
    # The Shopify app's client id / client secret (Partner dashboard -> App -> Client credentials)
    # and its webhook signing secret. Blank by default: ShopifyProperties#isConfigured() is then
    # false, POST /shopify/oauth/authorize answers 503, and GET /integrations/store/status reports
    # shopifyAvailable=false so the settings page does not offer a connect button that cannot work.
    # These three had NO binding at all until now, and no compose file forwarded them, so Shopify
    # connect could not be switched on in any deployed environment.
    api-key: ${INFLUORA_SHOPIFY_APIKEY:}
    api-secret: ${INFLUORA_SHOPIFY_APISECRET:}
    webhook-signing-secret: ${INFLUORA_SHOPIFY_WEBHOOKSIGNINGSECRET:}
    token-encryption-key: ${INFLUORA_SHOPIFY_TOKENENCRYPTIONKEY:}
    # [F-0731] Where Shopify sends the merchant's browser after they approve the install. This MUST
    # be a FRONTEND route, not this API: /shopify/oauth/callback returns a JSON ApiResponse, so a
    # browser landing there directly is shown raw JSON with no way back into the app. The default
    # derives from influora.web-base-url so it follows whatever SPA origin this deploy actually
    # serves, rather than being a second hardcoded copy of the domain that drifts (which is exactly
    # how the WooCommerce delivery URL ended up pointing at a host we do not own).
    #
    # Only used once api-key/api-secret above are set; until then isConfigured() is false and
    # /authorize refuses before this value is ever read.
    redirect-uri: ${INFLUORA_SHOPIFY_REDIRECTURI:${influora.web-base-url}/brand/settings/shopify/callback}
  woocommerce:
    token-encryption-key: ${INFLUORA_WOOCOMMERCE_TOKENENCRYPTIONKEY:}
  conversion-webhook:
    token-encryption-key: ${INFLUORA_CONVERSIONWEBHOOK_TOKENENCRYPTIONKEY:}
  # [SEC: Kabir Option-1 audit P1 must-fix] Wallet business limits. max-topup-amount is the
  # authoritative server-side ceiling on POST /wallet/topup — enforced in
  # WalletTopUpService#initiateTopUp, right after the existing positive-amount check. The DTO's
  # @DecimalMax (WalletTopUpRequest#amount) hardcodes the same value for fast 400 feedback but is
  # NOT authoritative (bean validation can't read Spring config).
  wallet:
    max-topup-amount: ${WALLET_MAX_TOPUP_AMOUNT:1000000.00}
  # [EV-014 / payoutswitch] Server-side kill switch on OUTBOUND creator payouts ->
  # PayoutProperties / PayoutKillSwitch. OFF by default and it must stay that way until
  # RazorpayX is actually provisioned and a human signs off: creators are paid MANUALLY by the
  # team over NEFT/IMPS, recorded through POST /admin/finance/payouts/manual (that admin rail is
  # NOT gated by this switch — it is the beta payout rail).
  #
  # Distinct from the frontend's VITE_PAYOUTS_ENABLED build flag (src/lib/api.ts:109), which only
  # decides whether the browser renders the Withdraw dialog. That flag never protected the
  # endpoint; this one does. Both layers default to false, so a missing env var can never enable
  # payouts by omission.
  payouts:
    enabled: ${PAYOUTS_ENABLED:false}
  # Brand-safety scoring feature flag (Priya ruling). OFF by default: ScoreCalculationJob then never
  # calls BrandSafetyScoreService and leaves creator_scores.brand_safety_score / garm_flags /
  # content_sentiment NULL on every row (its pre-existing behaviour). When turned on, EACH scored
  # creator triggers a chunked LLM classification call to the influora-ai (Python) service
  # (influora.brand-safety-ai.base-url), so max-creators-per-run caps how many creators incur that
  # real-money fan-out per daily run (the job prioritises missing/stalest brand-safety scores so
  # coverage rotates). See application-prod.yml for a commented enable-with-cap example.
  brand-safety-scoring:
    enabled: ${BRAND_SAFETY_SCORING_ENABLED:false}
    max-creators-per-run: ${BRAND_SAFETY_SCORING_MAX_CREATORS_PER_RUN:100}
  # Creator AI Co-pilot daily suggestion (CreatorCopilotProperties). OFF by default, same
  # conservative convention as brand-safety-scoring above — but note the failure is SILENT and
  # user-visible, not merely inert: with enabled=false both CreatorCaptionSyncJob (2 AM UTC) and
  # CreatorThemeTaggingJob (3 AM UTC) return immediately, so creator_captions stays empty,
  # CreatorProfile.theme_tags stays NULL (that job is its only writer), and CreatorNudgeService
  # returns 'pending_tagging' on every request — which the FE renders as "Usually ready within a
  # day." forever, to a creator who has successfully connected Instagram.
  #
  # Turning it on costs, per night: one Meta Graph media call per connected creator (caption sync,
  # capped by caption-sync-max-creators-per-run) and one influora-ai phrasing call per creator who
  # actually clears score-threshold. Theme tagging itself is pure Java keyword matching against
  # trendspark/theme-taxonomy.json — no model call, no caption text leaves the box.
  #
  # theme-tag-batch-cron / caption-sync-cron are read as @Scheduled placeholders on the two job
  # classes, not as CreatorCopilotProperties fields (see that class's javadoc); they live under this
  # prefix so the whole feature has one config block, and the binder ignores them by default.
  creator-copilot:
    enabled: ${CREATOR_COPILOT_ENABLED:false}
    score-threshold: ${CREATOR_COPILOT_SCORE_THRESHOLD:2}
    max-suggestions-per-creator-per-day: ${CREATOR_COPILOT_DAILY_CAP:1}
    prompt-version: ${CREATOR_COPILOT_PROMPT_VERSION:creator-copilot-v1}
    caption-sync-media-limit: ${CREATOR_COPILOT_CAPTION_SYNC_MEDIA_LIMIT:25}
    caption-sync-max-creators-per-run: ${CREATOR_COPILOT_CAPTION_SYNC_MAX_CREATORS_PER_RUN:0}
    caption-sync-cron: ${CREATOR_COPILOT_CAPTION_SYNC_CRON:0 0 2 * * *}
    theme-tag-batch-cron: ${CREATOR_COPILOT_THEME_TAG_CRON:0 0 3 * * *}
  # TrendSpark trend-pull data sources (T4 ingest job) — TrendIngestProperties. Blank defaults (NOT
  # REPLACE_WITH placeholders), same convention as influora.meta.app-id/app-secret above: these are
  # read-only third-party API keys, not signing/encryption secrets, so SecretsStartupValidator does
  # not check them and the app boots fine with all three unset (isConfigured() just goes false).
  #
  # T-GOLIVE-0918 repair round 3 [vikram · 2026-09-18] — HIGH fix: max-rows-per-run, region and
  # classifier-workspace-id were plain Java-side defaults with NO binding here at all, so an
  # operator could not set them without editing this file. Every property TrendPullJob reads is now
  # bound to an env var, same convention as the four already below.
  #
  # classifier-workspace-id is the one property this lane is NOT authorized to pick a value for
  # (TrendIngestProperties#classifierWorkspaceId javadoc): BrandSafetyAiClient#classify is a
  # per-workspace, credit-metered call and there is no platform/system workspace concept anywhere
  # in this codebase (verified: no SYSTEM_WORKSPACE/PLATFORM_WORKSPACE constant). Binding it to
  # TREND_INGEST_CLASSIFIER_WORKSPACE_ID (blank default) does not decide who pays — it only makes
  # the value configurable once Swapnil/Priya rule on it; until then the blank default keeps the
  # job failing closed exactly as before (see TrendPullJob#pullTrends "classifier_unconfigured").
  # DEPLOY lane: this env var is NOT yet set anywhere and does not need to be until that ruling
  # lands — flagging its name now so it is not missed when it does.
  trend-ingest:
    enabled: ${TREND_INGEST_ENABLED:false}
    newsapi-api-key: ${NEWSAPI_KEY:}
    tmdb-api-key: ${TMDB_API_KEY:}
    youtube-api-key: ${YOUTUBE_API_KEY:}
    pull-cron: ${TREND_INGEST_PULL_CRON:0 0 5 * * *}
    max-rows-per-run: ${TREND_INGEST_MAX_ROWS_PER_RUN:100}
    region: ${TREND_INGEST_REGION:IN}
    classifier-workspace-id: ${TREND_INGEST_CLASSIFIER_WORKSPACE_ID:}
  # meera_interaction_log retention purge (MeeraInteractionLogRetentionPurgeJob). HARD, MANDATORY
  # predecessor to any future read/join/analytics consumer of this table (Priya's PARTIAL-2 ruling,
  # wiki/build/partials-resolution-plan.md) and Kabir's L1 fast-follow (wiki/build/phase2-kabir-
  # security.md). enabled defaults false everywhere (same conservative-default convention as
  # brand-safety-scoring above and influora.cleanup.dry-run) so no environment starts deleting rows
  # just because this job exists on the classpath; see application-prod.yml to opt in.
  meera-interaction-log-retention:
    enabled: ${MEERA_INTERACTION_LOG_RETENTION_ENABLED:false}
    retention-days: ${MEERA_INTERACTION_LOG_RETENTION_DAYS:180}
