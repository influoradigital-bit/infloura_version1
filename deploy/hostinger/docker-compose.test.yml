name: influora-test

# Meera/Priya — IP-ONLY TEST deploy (no domain, no TLS). NOT production.
# Serves on http://200.141.1.6 (single-origin, Caddy path-routes). dev profile.
# SECRETS: every ${VAR} below is supplied via the Hostinger MCP `environment` field at deploy
# time (NEVER committed). Values come from influora-ai/.env + influora-api/.env.
# When you get a real domain: switch to docker-compose.hostinger.yml (prod profile + TLS).

configs:
  caddyfile:
    content: |
      {
        auto_https off
      }
      :80 {
        handle /api/* {
          reverse_proxy influora-api:8080 {
            header_up X-Forwarded-Proto http
          }
        }
        handle_path /meera/* {
          reverse_proxy influora-ai:8000 {
            flush_interval -1
          }
        }
        handle {
          reverse_proxy frontend:80
        }
      }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - frontend
      - influora-api
      - influora-ai

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: influora
      MYSQL_USER: influora_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  influora-api:
    image: ghcr.io/influoradigital-bit/influora-api:latest
    restart: unless-stopped
    environment:
      APP_ENV: dev
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/influora?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: influora_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      INFLUORA_API_PUBLIC_URL: http://200.141.1.6/api/v1
      INFLUORA_WEB_BASE_URL: http://200.141.1.6
      CORS_ALLOWED_ORIGINS: http://200.141.1.6
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      INTERNAL_REQUEST_HMAC_SECRET: ${INTERNAL_HMAC_KEY}
      INTERNAL_SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SIGNING_KEY}
      BRAND_SAFETY_AI_BASE_URL: http://influora-ai:8000
      TRENDSPARK_AI_BASE_URL: http://influora-ai:8000
      MEERA_CHAT_AI_BASE_URL: http://influora-ai:8000
      ANALYZE_SITE_AI_BASE_URL: http://influora-ai:8000
      CLAMAV_HOST: ""
      # TEST ONLY: allow SUPER_ADMIN/ADMIN login without MFA enrollment (default is true and
      # blocks a freshly-seeded admin with no in-app enrollment path). Re-enable for production.
      INFLUORA_ADMIN_MFAENFORCEONLOGIN: "false"
      # --- Email: MSG91 + its SMTP relay (Msg91EmailClient) ---
      MSG91_ENABLED: "true"
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID}
      MSG91_ROUTE: "4"
      MSG91_WIDGET_ID: ${MSG91_WIDGET_ID}
      MSG91_TOKEN_AUTH: ${MSG91_TOKEN_AUTH}
      MSG91_EMAIL_DOMAIN: ${MSG91_EMAIL_DOMAIN}
      MSG91_FROM_EMAIL: ${MSG91_FROM_EMAIL}
      MSG91_FROM_NAME: Influora
      MSG91_EMAIL_TEMPLATE_ID: ${MSG91_EMAIL_TEMPLATE_ID}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID}
      MSG91_EMAIL_COMPANY_NAME: ${MSG91_EMAIL_COMPANY_NAME}
      MSG91_EMAIL_TEMPLATE_OTP_VARIABLE: otp
      MSG91_EMAIL_TRANSACTIONAL_LINK_VARIABLE: magic_link
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: "587"
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      # --- Cloudflare R2 media storage ---
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
    depends_on:
      mysql: { condition: service_healthy }

  influora-ai:
    image: ghcr.io/influoradigital-bit/influora-ai:latest
    restart: unless-stopped
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: claude-sonnet-4-5-20250929
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      # Verify Meera stream tokens against the API's real JWKS (same path as prod).
      SPRING_JWKS_URL: http://influora-api:8080/api/v1/.well-known/jwks.json
      SPRING_INTERNAL_BASE_URL: http://influora-api:8080/api/v1
      # MUST byte-match the Java side.
      INTERNAL_HMAC_KEY: ${INTERNAL_HMAC_KEY}
      SERVICE_TOKEN_SIGNING_KEY: ${SERVICE_TOKEN_SIGNING_KEY}
      # Browser SSE origin — must equal the frontend origin or the preflight fails.
      MEERA_ALLOWED_ORIGINS: http://200.141.1.6
      REDIS_URL: redis://redis:6379
      # Cost guard on a public test box.
      AI_DAILY_SPEND_CEILING_USD: "5.0"
      AI_SPEND_KILL_SWITCH: "false"
    depends_on:
      - influora-api

  frontend:
    image: ghcr.io/influoradigital-bit/influora-web:latest
    restart: unless-stopped

volumes:
  mysql_test_data:
