name: influora-test

# Meera/Priya — IP-ONLY TEST deploy (no domain, no TLS). NOT production.
#
# Purpose: prove the stack builds, boots, and is clickable on http://200.141.1.6.
# Differences from docker-compose.hostinger.yml (the real prod one):
#   - dev profile (APP_ENV/SPRING_PROFILES_ACTIVE=dev): boots on built-in dev keys, no
#     Secure-cookie requirement (so login works over plain HTTP), no GST validator, and
#     NoOp malware scan → ClamAV dropped (~2 GB RAM saved on this 2-vCPU box).
#   - single origin: everything on http://200.141.1.6, Caddy path-routes. Same-origin ⇒ no CORS.
#   - Caddy config is INLINE (compose `configs.content`) because the Hostinger MCP deploys only
#     this one file — a bind-mounted ./Caddyfile would not exist on the box.
#
# Deploy: Hostinger MCP createNewProject(project_name="influora-test", content=<this file>,
#         environment=<the ${VARs} below>). Images must exist in GHCR first (publish workflow).
#
# When you get a real domain: switch to docker-compose.hostinger.yml (prod profile + real TLS +
# real secrets) and rebuild the web image with the domain URLs.

configs:
  caddyfile:
    content: |
      {
        auto_https off
      }
      :80 {
        handle_path /api/* {
          reverse_proxy influora-api:8080 {
            header_up X-Forwarded-Proto http
          }
        }
        handle_path /meera/* {
          reverse_proxy influora-ai:8000 {
            flush_interval -1
          }
        }
        handle {
          reverse_proxy frontend:80
        }
      }

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    configs:
      - source: caddyfile
        target: /etc/caddy/Caddyfile
    depends_on:
      - frontend
      - influora-api
      - influora-ai

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: influora
      MYSQL_USER: influora_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_test_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  influora-api:
    image: ghcr.io/influoradigital-bit/influora-api:latest
    restart: unless-stopped
    environment:
      APP_ENV: dev
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/influora?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: influora_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      INFLUORA_API_PUBLIC_URL: http://200.141.1.6/api/v1
      INFLUORA_WEB_BASE_URL: http://200.141.1.6
      CORS_ALLOWED_ORIGINS: http://200.141.1.6
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Shared api<->ai secrets — set explicitly so both sides match regardless of dev defaults.
      INTERNAL_REQUEST_HMAC_SECRET: ${INTERNAL_HMAC_KEY}
      INTERNAL_SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SIGNING_KEY}
      # Internal AI URLs (validator rejects localhost even in some paths).
      BRAND_SAFETY_AI_BASE_URL: http://influora-ai:8000
      TRENDSPARK_AI_BASE_URL: http://influora-ai:8000
      MEERA_CHAT_AI_BASE_URL: http://influora-ai:8000
      ANALYZE_SITE_AI_BASE_URL: http://influora-ai:8000
      CLAMAV_HOST: ""
    depends_on:
      mysql: { condition: service_healthy }

  influora-ai:
    image: ghcr.io/influoradigital-bit/influora-ai:latest
    restart: unless-stopped
    environment:
      APP_ENV: dev
      LOG_LEVEL: INFO
      # Optional: AI replies won't work without a real key. Leave blank to test everything else.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      SARVAM_API_KEY: ${SARVAM_API_KEY:-}
      # MUST byte-match the Java side above.
      INTERNAL_HMAC_KEY: ${INTERNAL_HMAC_KEY}
      SERVICE_TOKEN_SIGNING_KEY: ${SERVICE_TOKEN_SIGNING_KEY}
      SPRING_INTERNAL_BASE_URL: http://influora-api:8080/api/v1
      REDIS_URL: redis://redis:6379
    depends_on:
      - influora-api

  frontend:
    image: ghcr.io/influoradigital-bit/influora-web:latest
    restart: unless-stopped

volumes:
  mysql_test_data:
