# F-1787 - security headers for the influora.in / www.influora.in static SPA.
#
# Two copies of this file exist and they MUST differ in exactly one line, the CSP header name:
#   influora-security-headers.conf          stage 1: Content-Security-Policy-Report-Only
#   influora-security-headers.enforce.conf  stage 2: Content-Security-Policy
# Check before installing either:   diff influora-security-headers.conf influora-security-headers.enforce.conf
# (must print exactly one changed line). Runbook: deploy/utho/nginx/RUNBOOK-F1787.md
#
# WHERE TO INCLUDE IT
#   Inside every location{} of the influora.in :443 server that serves the SPA or its static
#   files, NOT at server{} level and NOT inside location /api/.
#   - nginx add_header is inherited from server{} only by locations that have NO add_header of
#     their own, so a location with its own add_header (e.g. Cache-Control on /assets/) needs
#     the include repeated inside it or it silently sends none of these.
#   - /api/ is proxied to Spring on 127.0.0.1:8082, and Spring already sends HSTS, X-Frame-Options
#     DENY, nosniff, Referrer-Policy no-referrer and a strict JSON CSP (verified live
#     2026-09-22 on /api/v1/health). A server-level include would be inherited by /api/ and send
#     every header twice (two CSPs are both enforced, two Referrer-Policy values are merged).
#
# 'always' on every line: without it nginx drops add_header on 4xx/5xx responses.
#
# HSTS RAMP
#   Rollout value is max-age=86400 (1 day), no includeSubDomains, no preload. After one clean
#   day on stage 2, change to max-age=31536000. includeSubDomains and preload are separate
#   decisions: preload is effectively irreversible.
#   NOTE: Spring already sends "max-age=31536000 ; includeSubDomains" on every /api/ response, so
#   any browser that has called the API already holds a 1-year policy covering every
#   *.influora.in host. Each HSTS response replaces the stored policy, so HTML (1 day) and API
#   (1 year + subdomains) responses will overwrite each other until the two values are aligned.
#   Both values require HTTPS on influora.in, so this is inconsistency, not a hole.
#
# CSP - built from the live bundle inventory (.proof-os/tasks/T-SECHDR-0922/origin-inventory.json)
#   script-src   no 'unsafe-inline', no 'unsafe-eval' (no eval/new Function in any first-party chunk;
#                GTM sandboxed templates and gtag do not need it). No hashes: the live index.html
#                has NO executable inline script (only an application/ld+json data block, which
#                CSP does not govern). Re-check on every FE deploy with csp-inline-hashes.mjs.
#                GTM Custom HTML tag_id 3 (inline Meta Pixel duplicate) WILL be reported/blocked:
#                delete it in GTM, tag_id 5 already fires the same pixel.
#   style-src    'unsafe-inline' is required: react-remove-scroll, React 19 hoisted <style> and the
#                Remotion player inject <style> elements with runtime text a hash cannot cover.
#   img/media    https: - image and video URLs come from the API (R2 presigned, Instagram/Facebook
#                CDN thumbnails, creator-submitted deliverable URLs); media cannot execute script.
#                blob:/data: - Meera voice plays blob: audio, the Meera demo embeds data:audio.
#   connect-src  https://influora.in is explicit because www.influora.in is served too and the
#                bundle hard-codes https://influora.in/api/v1 (cross-origin from www).
#                https://ai.influora.in is NOT listed: the live bundle never calls it (Meera
#                streams over same-origin /api/v1/meera). Least privilege - add it only in the same
#                change as a build that sets VITE_MEERA_STREAM_URL.
#   frame-src    Razorpay checkout; www.facebook.com for the Meta Pixel form-POST iframe;
#                GTM noscript iframe; YouTube/Vimeo for VITE_WALKTHROUGH_VIDEO_* builds.
#   form-action  www.facebook.com: fbevents.js posts large payloads as a hidden form to /tr.
#                Razorpay is used with a JS handler (src/lib/razorpay.ts), no callback_url, so the
#                parent page never posts a form to Razorpay.
#   No report-uri yet: there is no CSP report endpoint, so stage 1 violations are read from the
#   browser console. Real-user reporting (a securitypolicyviolation listener posting to the existing
#   client-error log) is ledger F-1789 and SHOULD land before stage 2 - see RUNBOOK 4c.
#
# Permissions-Policy: microphone=(self) is REQUIRED - Meera voice (useVoiceInput.ts,
# voice-powered-orb.tsx) calls getUserMedia. payment is limited to self + Razorpay rather than
# denied, because Razorpay's checkout iframe may use the Payment Request API.
# Values containing double quotes are single-quoted for nginx; values containing 'self' are
# double-quoted. Do not retype these lines elsewhere - test-server.mjs parses this file.

add_header Strict-Transport-Security "max-age=86400" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy 'accelerometer=(), autoplay=(self "https://www.youtube.com" "https://player.vimeo.com"), camera=(), display-capture=(), encrypted-media=(self "https://www.youtube.com" "https://player.vimeo.com"), fullscreen=(self "https://www.youtube.com" "https://player.vimeo.com"), geolocation=(), gyroscope=(), hid=(), magnetometer=(), microphone=(self), midi=(), payment=(self "https://api.razorpay.com" "https://checkout.razorpay.com"), screen-wake-lock=(), serial=(), usb=(), xr-spatial-tracking=()' always;
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.googletagmanager.com https://www.clarity.ms https://scripts.clarity.ms https://connect.facebook.net https://checkout.razorpay.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https://influora.in https://www.googletagmanager.com https://*.google-analytics.com https://*.analytics.google.com https://stats.g.doubleclick.net https://www.google.com https://*.clarity.ms https://www.facebook.com https://api.razorpay.com https://lumberjack.razorpay.com https://lumberjack-cx.razorpay.com https://lumberjack-metrics.razorpay.com; frame-src https://api.razorpay.com https://checkout.razorpay.com https://www.facebook.com https://www.googletagmanager.com https://www.youtube.com https://player.vimeo.com; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self' https://www.facebook.com; frame-ancestors 'none'" always;
