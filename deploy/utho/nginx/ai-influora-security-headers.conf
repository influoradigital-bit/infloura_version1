# F-1787 - headers for ai.influora.in (Python AI service: JSON + SSE, never HTML).
# Include inside the proxying location{} of the ai.influora.in :443 server.
#
# Only nosniff + HSTS: this host serves no documents, so CSP / X-Frame-Options / Permissions-Policy
# would govern nothing. proxy_hide_header first guarantees exactly ONE copy of each header whether
# or not the upstream (Caddy -> FastAPI) already sends it; without it a duplicate HSTS would be
# ignored by browsers after the first and a duplicate nosniff is merely noise, but single copies
# keep the curl checks in RUNBOOK-F1787.md unambiguous.
# HSTS ramp: same as influora-security-headers.conf (1 day first, 31536000 after a clean day).

proxy_hide_header X-Content-Type-Options;
proxy_hide_header Strict-Transport-Security;
add_header X-Content-Type-Options "nosniff" always;
add_header Strict-Transport-Security "max-age=86400" always;
