# Influora on Utho -- SUBDOMAINS ONLY (app / api / ai).
#
# Deliberately does NOT touch influora.in or www.influora.in. The box already has
# /etc/nginx/sites-available/influora.in serving the apex from /var/www/influora, and
# declaring the same hostname twice makes nginx silently pick one -- the same class of
# fault that made every domain serve Influora on 2026-08-21.
#
# Bring these three up first and prove the stack. Switch the apex to the container
# afterwards with nginx-influora.conf (which does own the apex), as a separate, reversible
# step -- the apex is currently serving real visitors and must not go down for this.
#
# Install:  /etc/nginx/sites-available/influora-app.conf
#           ln -s ../sites-available/influora-app.conf /etc/nginx/sites-enabled/
#           nginx -t && systemctl reload nginx

# ---- HTTP: ACME challenges, everything else redirected ----
server {
    listen 80;
    listen [::]:80;
    server_name app.influora.in api.influora.in ai.influora.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
# ---- app.influora.in — the React SPA ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.influora.in;

    ssl_certificate     /etc/letsencrypt/live/app.influora.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.influora.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# ---- api.influora.in — Java API ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.influora.in;

    ssl_certificate     /etc/letsencrypt/live/api.influora.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.influora.in/privkey.pem;

    # Mirrors Caddy's `request_body { max_size 1GB }` and Spring's max-request-size.
    # nginx's default is 1m: leave it and every deliverable upload fails with 413.
    client_max_body_size 1G;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Mirrors Caddy's read_timeout 300s for large uploads.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        # Stream the upload through instead of spooling 1GB to disk first.
        proxy_request_buffering off;
    }
}

# ---- ai.influora.in — Python AI service, SSE ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.influora.in;

    ssl_certificate     /etc/letsencrypt/live/ai.influora.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.influora.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # THE SSE SET — this is Caddy's `flush_interval -1` expressed in nginx.
        # Without these three, Meera's token-by-token stream is buffered and the user
        # sees nothing until the turn completes, which reads as a hang, not a bug.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # Mirrors Caddy's read_timeout 3600s — a long stream must not be cut at 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
