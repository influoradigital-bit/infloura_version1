# Influora on Utho -- SHARED BOX variant (Snapsby + n8n already live on 150.241.245.242).
#
# INTENDED to differ from docker-compose.utho.yml only by JAVA_TOOL_OPTIONS. Until F-0787
# (2026-09-17) that was false: this file had silently drifted 9 influora-api env keys behind
# (CREATOR_COPILOT_ENABLED, MEERA_CREATOR_ENABLED, SMTP_STARTTLS_ENABLE, SMTP_SSL_ENABLE,
# CREATOR_INVITE_TOKEN_SECRET, META_CREATOR_MARKETPLACE_ENABLED, ADMIN_NOTIFICATION_EMAIL,
# META_SYSTEM_IG_USER_ID, META_SYSTEM_IG_ACCESS_TOKEN) -- an explicit-map `environment:` forwards
# ONLY listed keys, so those never reached the API from this file. The influora-api key SET is now
# enforced equal by .proof-os/gates/utho-compose-keysets-match.sh. Some DEFAULTS still differ on
# purpose: this file uses `${VAR:-default}` where utho.yml has a bare `${VAR}` (Q7.4). Values in
# the other services (influora-ai etc.) are NOT checked by that gate.
#
# Why the mysql container is KEPT even though the host runs MySQL (measured 2026-08-21):
#   - the host is MySQL 8.4.7. Flyway 10.10.0 supports up to 8.1 and warns that 8.4 is
#     untested -- Snapsby logs that warning on every boot. Influora has 107 migrations that
#     were CI-proven against MySQL 8.0 specifically; that proof does not carry to 8.4, and a
#     half-applied migration on an escrow/payout schema is worse than 400 MB of RAM.
#   - isolation: one shared instance couples both products backups, restarts and failure
#     modes. A heavy Influora query would land on Snapsby.
#
# Box facts 2026-08-21: 7.3 GB total, ~3.5 GB available, 4 GB swap added. Expect ~3.3 GB
# resident for this stack. It fits because of the swap, not comfortably -- move to a
# dedicated server before real payment volume.
name: influora

# Influora on Utho — OPTION A: Caddy behind the box's existing nginx.
#
# Derived from deploy/hostinger/docker-compose.hostinger.yml. The ONLY difference is the
# caddy `ports:` block; every service, image, env var and volume below is unchanged, so
# anything documented for the Hostinger file still applies here.
#
# Use WITH deploy/utho/Caddyfile (not the hostinger one) — that variant sets `auto_https
# off` and `http_port 8080`, because Caddy must not attempt ACME on a box where it cannot
# reach :443.
#
# On the box:  /opt/influora/docker-compose.yml + /opt/influora/Caddyfile + /opt/influora/.env

# Meera/Priya — Hostinger VPS production stack, REGISTRY-IMAGES path.
#
# Difference from BLUEPRINT/10's docker-compose.prod.yml: that one uses `build:` contexts
# (builds on the box, needs SSH + source checkout). THIS one pulls pre-built images from
# GHCR (published by .github/workflows/publish-images.yml) and adds Caddy for automatic TLS,
# so the whole stack deploys through the Hostinger management API with NO SSH.
#
# Deploy: Hostinger MCP `createNewProject(project_name="influora", content=<this file>,
#         environment=<all the VARs below>)`. Redeploy: `updateProjectV1`.
#
# Env contract: every ${VAR} below must be supplied via the MCP `environment` field
# (Hostinger writes them to the project .env). Full list + how to generate each:
# BLUEPRINT/06-DEPLOYMENT-AND-API-KEYS.md and BLUEPRINT/10 §5. The PII keys encrypt every
# email/phone/bank row — back them up OFF this box before go-live or the data is lost forever.
#
# Nothing but Caddy publishes a host port. mysql/redis/clamav/api/ai/web are reachable only
# on the internal Docker network — strictly better than exposing 8080/8000/3306 at all.

# [SEC: Kabir CR-11 red-team, M-4] Log rotation. Every service previously inherited Docker's
# `json-file` driver with its default `max-size` of UNLIMITED, and logback-spring.xml has a single
# CONSOLE appender with no rolling policy — so container logs grew in
# /var/lib/docker/containers/<id>/*-json.log until the disk filled.
#
# That is a product-down path, not a tidiness issue: this box has ONE disk, shared by the
# `mysql_data` volume, `clamav_data`, and `caddy_data` (issued TLS certs). Disk-full takes MySQL
# with it, and Caddy's certificate renewal too.
#
# It became reachable from the internet with `POST /client-errors`: an unauthenticated endpoint
# that logs ~9 KB per max-size report at WARN. The client-side dedupe only stops an honest browser
# looping; a script posting distinct `message` values is unaffected. 50m x 5 caps each service at
# 250 MB.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *default-logging
    # OPTION A (Utho, 2026-08-21): nginx already owns 80/443 on this box as the
    # Cloudflare origin for snapsby.com, so Caddy CANNOT bind them — and stopping nginx
    # would take snapsby.com down. Caddy therefore listens on 8080 for plain HTTP only
    # and nginx reverse-proxies to it. Bound to 127.0.0.1 so 8080 is not reachable from
    # the internet. TLS terminates at nginx; see deploy/utho/nginx-influora.conf.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ROOT_DOMAIN: ${ROOT_DOMAIN}   # influora.in -- apex + www, serves the marketing site
      APP_DOMAIN: ${APP_DOMAIN}     # app.yourdomain.com
      API_DOMAIN: ${API_DOMAIN}     # api.yourdomain.com
      AI_DOMAIN: ${AI_DOMAIN}       # ai.yourdomain.com
      ACME_EMAIL: ${ACME_EMAIL}     # for Let's Encrypt expiry notices
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data            # issued certs — persist across redeploys
      - caddy_config:/config
    depends_on:
      - frontend
      - influora-api
      - influora-ai

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    logging: *default-logging
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: influora
      MYSQL_USER: influora_app
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --require-secure-transport=ON
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *default-logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]

  clamav:
    image: clamav/clamav:1.3
    restart: unless-stopped
    logging: *default-logging
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  influora-api:
    image: ghcr.io/influoradigital-bit/influora-api:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      # SHARED BOX: cap the heap. Uncapped, the JVM sizes MaxHeap to ~25% of HOST RAM
      # (7.3 GB here) -- memory it reserves from its neighbours rather than from itself.
      JAVA_TOOL_OPTIONS: "-Xmx900m -XX:MaxMetaspaceSize=256m"
      # ---- Boot gates: BOTH required, both must be prod (doc 06 §2.3) ----
      APP_ENV: prod
      SPRING_PROFILES_ACTIVE: prod
      # ---- Database (useSSL=true is mandatory) ----
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/influora?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: influora_app
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      # ---- Public URLs ----
      INFLUORA_API_PUBLIC_URL: https://${API_DOMAIN}/api/v1
      INFLUORA_WEB_BASE_URL: https://${APP_DOMAIN}
      # Exact-origin allowlist — CorsConfig.java calls setAllowCredentials(true), so a wildcard
      # is not legal and every origin the SPA is served from must be listed verbatim. The apex
      # and www are here because they serve the SAME bundle as app.: a visitor who lands on
      # influora.in and clicks Login stays on that origin, so its API calls carry
      # `Origin: https://influora.in` and would otherwise be refused.
      CORS_ALLOWED_ORIGINS: https://${APP_DOMAIN},https://${ROOT_DOMAIN},https://www.${ROOT_DOMAIN}
      # ---- Behind Caddy (TLS terminates at the proxy) ----
      # [SEC: Kabir CR-11 red-team, Blocker-1] `framework` here defeated EVERY IP-keyed rate limit,
      # login brute-force included: ForwardedHeaderFilter takes the left-most (client-spoofable)
      # X-Forwarded-For entry, does no trusted-proxy validation, and strips the headers before the
      # Security chain sees them. `native` uses Tomcat's RemoteIpValve, which validates against
      # server.tomcat.remoteip.internal-proxies and walks XFF right-to-left. See application.yml.
      SERVER_FORWARD_HEADERS_STRATEGY: native
      TRUSTED_PROXIES: ${TRUSTED_PROXIES}   # verify: docker network inspect (bridge gateway)
      AUTH_REFRESH_COOKIE_SECURE: "true"
      # ---- Signing secrets (all distinct, >=32 bytes) ----
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      MEERA_STREAM_SIGNING_SECRET: ${MEERA_STREAM_SIGNING_SECRET}
      INTERNAL_SERVICE_TOKEN_SECRET: ${INTERNAL_SERVICE_TOKEN_SECRET}
      INTERNAL_REQUEST_HMAC_SECRET: ${INTERNAL_REQUEST_HMAC_SECRET}
      # T-GOLIVE-0918 [meera · 2026-09-18] — REPAIR ROUND 2 MEDIUM: this key forwarded
      # INFLUORA_BRANDSAFETYSERVICETOKEN_SIGNINGSECRET (Spring's relaxed-binding alias), which has
      # NO ${...} placeholder anywhere in application.yml — only BRAND_SAFETY_SERVICE_TOKEN_SECRET
      # does, at application.yml:279 (influora.brand-safety-service-token.signing-secret). An
      # unset host var here still creates the container env key with a BLANK value (`docker compose
      # config` prints "variable is not set, defaulting to a blank string"), and an OS-environment
      # var deterministically outranks an application.yml placeholder in Spring's property sources
      # — so this line silently overrode a correctly-set BRAND_SAFETY_SERVICE_TOKEN_SECRET with "".
      # Fixed to forward the name application.yml actually binds to. Source:
      # BrandSafetyServiceTokenProperties.java:42-56, application.yml:279.
      # T-GOLIVE-0918 [meera · 2026-09-18] — REPAIR ROUND 3 HIGH: this compose-side fix alone still
      # left an end-to-end break — deploy/utho/generate-env.sh:55 kept writing the OLD name
      # (INFLUORA_BRANDSAFETYSERVICETOKEN_SIGNINGSECRET) into any freshly generated env, so this key
      # resolved blank on that env until generate-env.sh was also renamed this round. No fallback is
      # forwarded here on purpose — generate-env.sh, this key and application.yml:279 must all agree
      # on exactly one name, not silently accept two.
      BRAND_SAFETY_SERVICE_TOKEN_SECRET: ${BRAND_SAFETY_SERVICE_TOKEN_SECRET}
      # ---- Keys with no YAML default (doc 06 §2.2) ----
      # T-GOLIVE-0918-R2 [meera - 2026-09-18] REPAIR R8 LOW: renamed from the dash-stripped
      # INFLUORA_JWKS_PRIVATEKEYPEM/PUBLICKEYPEM to the literal name application.yml:290-291
      # documents (influora.jwks.private-key-pem/public-key-pem's only mention in this repo) --
      # generate-env.sh, all three compose files and application.yml must agree on one name.
      # Spring's relaxed binding (SystemEnvironmentPropertyMapper.convertLegacyName) accepted
      # both spellings either way, so this is name-agreement only, not a behavior change. If the
      # live box's own influora.env already holds INFLUORA_JWKS_PRIVATEKEYPEM/PUBLICKEYPEM,
      # rename those keys IN PLACE (keep the values) on the next edit -- same migration-note
      # pattern as the admin-MFA and MEERA_PUBLIC_CHAT_URL renames elsewhere in this document.
      INFLUORA_JWKS_PRIVATE_KEY_PEM: ${INFLUORA_JWKS_PRIVATE_KEY_PEM}
      INFLUORA_JWKS_PUBLIC_KEY_PEM: ${INFLUORA_JWKS_PUBLIC_KEY_PEM}
      # T-GOLIVE-0918-R2 [meera - 2026-09-18] REPAIR R5 LOW (weaker than the brand-safety HIGH above --
      # relaxed binding likely already made the alias work; see generate-env.sh:69 for the full
      # analysis). Was INFLUORA_ADMIN_MFASECRETENCRYPTIONKEY (Spring's relaxed-binding alias); renamed
      # to match application.yml:298's literal ${ADMIN_MFA_SECRET_ENCRYPTION_KEY:...} placeholder so
      # generate-env.sh/compose/application.yml agree on one name, closing the done_when name-agreement
      # clause and the operator-facing footgun of setting the documented name and being ignored.
      # [REPAIR R6] MIGRATION NOTE for an EXISTING env file: rename
      # INFLUORA_ADMIN_MFASECRETENCRYPTIONKEY to ADMIN_MFA_SECRET_ENCRYPTION_KEY IN PLACE, keeping
      # its current value. Do NOT re-run generate-env.sh to "fix" this — it mints a fresh random
      # key, leaving every admin-MFA secret already encrypted under the old key undecryptable.
      ADMIN_MFA_SECRET_ENCRYPTION_KEY: ${ADMIN_MFA_SECRET_ENCRYPTION_KEY}
      INFLUORA_PII_EMAILPHONEENCRYPTIONKEY: ${INFLUORA_PII_EMAILPHONEENCRYPTIONKEY}
      INFLUORA_PII_BANKENCRYPTIONKEY: ${INFLUORA_PII_BANKENCRYPTIONKEY}
      INFLUORA_SHOPIFY_TOKENENCRYPTIONKEY: ${INFLUORA_SHOPIFY_TOKENENCRYPTIONKEY}
      # Optional. Shopify connect stays switched off (and hidden in the brand settings UI)
      # until all of these are set from the Shopify Partner app's client credentials.
      INFLUORA_SHOPIFY_APIKEY: ${INFLUORA_SHOPIFY_APIKEY:-}
      INFLUORA_SHOPIFY_APISECRET: ${INFLUORA_SHOPIFY_APISECRET:-}
      INFLUORA_SHOPIFY_WEBHOOKSIGNINGSECRET: ${INFLUORA_SHOPIFY_WEBHOOKSIGNINGSECRET:-}
      INFLUORA_WOOCOMMERCE_TOKENENCRYPTIONKEY: ${INFLUORA_WOOCOMMERCE_TOKENENCRYPTIONKEY}
      INFLUORA_CONVERSIONWEBHOOK_TOKENENCRYPTIONKEY: ${INFLUORA_CONVERSIONWEBHOOK_TOKENENCRYPTIONKEY}
      # ---- Internal service URLs (validator rejects localhost) ----
      BRAND_SAFETY_AI_BASE_URL: http://influora-ai:8000
      TRENDSPARK_AI_BASE_URL: http://influora-ai:8000
      MEERA_CHAT_AI_BASE_URL: http://influora-ai:8000
      VOICE_AI_BASE_URL: http://influora-ai:8000
      ANALYZE_SITE_AI_BASE_URL: http://influora-ai:8000
      # Added 2026-09-12: application-prod.yml no longer carries a fallback for these,
      # so an unset var now REFUSES THE BOOT instead of resolving to a fiction.
      CREATOR_COPILOT_AI_BASE_URL: http://influora-ai:8000
      # ---- TrendSpark trend-pull data sources (T4 ingest job) ----
      TREND_INGEST_ENABLED: ${TREND_INGEST_ENABLED:-false}
      NEWSAPI_KEY: ${NEWSAPI_KEY:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      # T-GOLIVE-0918 [meera · 2026-09-18] — was unforwarded (F-0787-class gap: explicit-map
      # environment: only passes listed keys). application.yml:559 reads
      # ${TREND_INGEST_PULL_CRON:0 0 5 * * *}; TrendIngestProperties#setPullCron (L108-110) guards
      # a blank value back to the same default for the @ConfigurationProperties bean, BUT
      # TrendPullJob.java:123's own `@Scheduled(cron = "${influora.trend-ingest.pull-cron:0 0 5 * *
      # *}")` resolves the SAME property key directly from the Environment and never goes through
      # that setter — a blank-but-present TREND_INGEST_PULL_CRON here still becomes the resolved
      # value of influora.trend-ingest.pull-cron (Spring only falls back to a `:` default when the
      # key is wholly ABSENT, not when it resolves to ""), so @Scheduled would receive cron="" and
      # fail to parse at boot. REPAIR ROUND 1 finding: this WAS mislabeled "belt-and-suspenders,
      # not load-bearing" before TrendPullJob landed (af23eb9) — it is now load-bearing: never ship
      # this env file with the var present-but-empty. Source: application.yml:559,
      # TrendIngestProperties.java:33-35,104-110, TrendPullJob.java:123.
      TREND_INGEST_PULL_CRON: ${TREND_INGEST_PULL_CRON:-0 0 5 * * *}
      # T-GOLIVE-0918-R2 [meera · 2026-09-18] — HIGH repair: these 3 TrendIngestProperties tunables
      # (max-rows-per-run, region, classifier-workspace-id) got a `${}` placeholder in
      # application.yml:575-577 in af23eb9's round-3 follow-up, but were never forwarded here —
      # 0 matches for "CLASSIFIER" in this file before this fix. TREND_INGEST_MAX_ROWS_PER_RUN and
      # TREND_INGEST_REGION are ordinary tunables with safe code defaults (application.yml:575-576);
      # TREND_INGEST_CLASSIFIER_WORKSPACE_ID is the one this lane is NOT authorized to pick a value
      # for (TrendIngestProperties#classifierWorkspaceId javadoc, application.yml:560-568) — no
      # platform/system workspace concept exists anywhere in this codebase, so setting a real
      # workspace id here would decide who pays for BrandSafetyAiClient#classify's per-headline,
      # credit-metered call, which is Swapnil/Priya's call, not this lane's (hard rule 8). Forwarding
      # the (blank-default) placeholder only makes it operator-settable once that ruling lands; while
      # it stays blank, TrendPullJob.java:241 keeps failing every headline closed with
      # reason=classifier_unconfigured, exactly as before this line existed. See §2/§4 of
      # wiki/processes/go-live-0918.md for the go-live-blocker callout.
      TREND_INGEST_MAX_ROWS_PER_RUN: ${TREND_INGEST_MAX_ROWS_PER_RUN:-100}
      TREND_INGEST_REGION: ${TREND_INGEST_REGION:-IN}
      TREND_INGEST_CLASSIFIER_WORKSPACE_ID: ${TREND_INGEST_CLASSIFIER_WORKSPACE_ID:-}
      # ---- Creator AI Co-pilot batch (OFF unless set in .env) ---- F-0787: was missing here.
      # Gates CreatorCaptionSyncJob + CreatorThemeTaggingJob. While false, a connected creator sees
      # "Usually ready within a day." indefinitely — see influora.creator-copilot in application.yml.
      # Q7.4: `:-false`, never a bare `${VAR}` — a present-but-empty value defeats Spring's
      # `${VAR:default}` (that default applies only when the property is ABSENT) and has crashed boot.
      CREATOR_COPILOT_ENABLED: ${CREATOR_COPILOT_ENABLED:-false}
      # T-GOLIVE-0918 [meera · 2026-09-18] — REPAIR ROUND 2 MEDIUM: these 7 CreatorCopilotProperties
      # tunables were named in wiki/processes/go-live-0918.md §2 as "the influora-api environment
      # keyset from docker-compose.utho.yml", but were never actually in either compose file — the
      # runbook's claim was false for these rows. Added so the compose-based deploy path (§READ THIS
      # FIRST §1 — a future-migration target, not today's live mechanism) can actually override
      # them, same as today's --env-file path already can. Defaults mirror application.yml:541-549.
      CREATOR_COPILOT_SCORE_THRESHOLD: ${CREATOR_COPILOT_SCORE_THRESHOLD:-2}
      CREATOR_COPILOT_DAILY_CAP: ${CREATOR_COPILOT_DAILY_CAP:-1}
      CREATOR_COPILOT_PROMPT_VERSION: ${CREATOR_COPILOT_PROMPT_VERSION:-creator-copilot-v1}
      CREATOR_COPILOT_CAPTION_SYNC_MEDIA_LIMIT: ${CREATOR_COPILOT_CAPTION_SYNC_MEDIA_LIMIT:-25}
      CREATOR_COPILOT_CAPTION_SYNC_MAX_CREATORS_PER_RUN: ${CREATOR_COPILOT_CAPTION_SYNC_MAX_CREATORS_PER_RUN:-0}
      CREATOR_COPILOT_CAPTION_SYNC_CRON: ${CREATOR_COPILOT_CAPTION_SYNC_CRON:-0 0 2 * * *}
      CREATOR_COPILOT_THEME_TAG_CRON: ${CREATOR_COPILOT_THEME_TAG_CRON:-0 0 3 * * *}
      # T-GOLIVE-0918 [meera · 2026-09-18] — REPAIR ROUND 2 MEDIUM: BrandSafetyScoringProperties
      # flags, same gap as the Creator Co-pilot tunables above. Source: application.yml:522-524.
      BRAND_SAFETY_SCORING_ENABLED: ${BRAND_SAFETY_SCORING_ENABLED:-false}
      BRAND_SAFETY_SCORING_MAX_CREATORS_PER_RUN: ${BRAND_SAFETY_SCORING_MAX_CREATORS_PER_RUN:-100}
      # T-MEERA-CREATOR-PHASE-A rollback flag for the whole Meera for Creators surface. F-0787: was
      # missing here. Default is `:-true`, NOT `:-false`: application.yml defaults it on and utho.yml
      # pins "true", and while this key was unforwarded the shared box ran on that `true` default —
      # `:-false` would 404 every CREATOR-audience Meera route on this box. Set false to roll back.
      MEERA_CREATOR_ENABLED: ${MEERA_CREATOR_ENABLED:-true}
      # T-GOLIVE-0918-R2 [meera · 2026-09-18] — REPAIR ROUND 7 LOW: this used to forward
      # INFLUORA_MEERA_STREAM_PUBLICCHATURL, Spring's relaxed-binding alias for
      # influora.meera.stream.public-chat-url, which has NO ${} placeholder anywhere in
      # application.yml/application-prod.yml. The canonical name application-prod.yml:109 actually
      # binds (${MEERA_PUBLIC_CHAT_URL}, no default in prod) was never forwarded at all — same
      # two-names-for-one-property pattern already fixed for BRAND_SAFETY_SERVICE_TOKEN_SECRET
      # (HIGH) and ADMIN_MFA_SECRET_ENCRYPTION_KEY (LOW) in this file — renamed here so
      # generate-env.sh/compose/application-prod.yml agree on one name. Source:
      # MeeraStreamProperties.java:25, SecretsStartupValidator.java:624-636. If the live box's
      # influora.env already holds INFLUORA_MEERA_STREAM_PUBLICCHATURL, rename that key in place
      # (keep the value) — do not re-run generate-env.sh, same migration note as the admin-MFA
      # rename above.
      MEERA_PUBLIC_CHAT_URL: https://${AI_DOMAIN}/chat
      CLAMAV_HOST: clamav
      # ---- Money + comms (no validator — break silently if wrong) ----
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAYX_ACCOUNT_NUMBER: ${RAZORPAYX_ACCOUNT_NUMBER}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
      MSG91_TOKEN_AUTH: ${MSG91_TOKEN_AUTH}
      MSG91_WIDGET_ID: ${MSG91_WIDGET_ID}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID}
      MSG91_WELCOME_TEMPLATE_ID: ${MSG91_WELCOME_TEMPLATE_ID}
      MSG91_EMAIL_TRANSACTIONAL_TEMPLATE_ID: ${MSG91_EMAIL_TRANSACTIONAL_TEMPLATE_ID}
      # TLD is .in, not application.yml's .com default (F-0390 A5)
      MSG91_EMAIL_DOMAIN: ${MSG91_EMAIL_DOMAIN}
      MSG91_FROM_EMAIL: ${MSG91_FROM_EMAIL}
      MSG91_FROM_NAME: ${MSG91_FROM_NAME}
      MSG91_EMAIL_COMPANY_NAME: ${MSG91_EMAIL_COMPANY_NAME}
      # F-0601 — MUST stay true wherever influora.auth.require-email-verification is on.
      # With this false (the application.yml default) the register pages skip the OTP gate,
      # nothing ever sets users.email_verified, and every signup 403s EMAIL_NOT_VERIFIED at
      # its second login. Depends on SMTP_HOST below being set.
      REQUIRE_EMAIL_OTP_BEFORE_REGISTER: ${REQUIRE_EMAIL_OTP_BEFORE_REGISTER:-true}
      # SMTP relay for Msg91EmailClient — unset SMTP_HOST means no JavaMailSender bean at all,
      # i.e. all outbound email silently dead (F-0390 A2)
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      # F-0787: were missing here. Utho drops outbound 587, so this box needs SMTP_PORT=465,
      # SMTP_SSL_ENABLE=true, SMTP_STARTTLS_ENABLE=false (application.yml mail block) — and without
      # these two lines the .env values never reached the API. Defaults match application.yml.
      SMTP_STARTTLS_ENABLE: ${SMTP_STARTTLS_ENABLE:-true}
      SMTP_SSL_ENABLE: ${SMTP_SSL_ENABLE:-false}
      # Signs one-click unsubscribe links (F-0390 A3) — no default is the git-committed placeholder
      UNSUBSCRIBE_SIGNING_SECRET: ${UNSUBSCRIBE_SIGNING_SECRET}
      # T-FESTIVALBOX-0905 -- salts the SHA-256 of the client address stored as
      # festival_enquiries.source_ip_hash, which is what throttles the PUBLIC enquiry form
      # (FestivalEnquiryService). SecretsStartupValidator checks this key and FAILS CLOSED outside
      # the dev profile, so omitting it does not degrade the form -- it aborts context refresh and
      # the WHOLE API fails to boot. generate-env.sh generates a real value via the same mechanism
      # as UNSUBSCRIBE_SIGNING_SECRET above.
      FESTIVAL_IP_HASH_SALT: ${FESTIVAL_IP_HASH_SALT}
      # Q5.5 (T-CREATORCONNECT-0902) — signs creator-invite links. F-0787: was missing here. Empty
      # default, not the committed dev literal: InviteTokenService fails closed on an empty secret
      # outside dev/test. See the full comment in docker-compose.utho.yml.
      CREATOR_INVITE_TOKEN_SECRET: ${CREATOR_INVITE_TOKEN_SECRET:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      # ---- Meta / Instagram OAuth (F-0374) ----
      # MetaApiProperties.isConfigured() is "app-id AND app-secret both non-blank". Absent these,
      # Meta OAuth is OFF at boot and Connect Instagram does nothing -- which fails Meta App
      # Review on its own, because a reviewer tests the submitted app and finds login disabled.
      # Two DISTINCT credential pairs: Facebook Login, and Business Login for Instagram.
      META_APP_ID: ${META_APP_ID}
      META_APP_SECRET: ${META_APP_SECRET}
      META_REDIRECT_URI: ${META_REDIRECT_URI}
      META_INSTAGRAM_APP_ID: ${META_INSTAGRAM_APP_ID}
      META_INSTAGRAM_APP_SECRET: ${META_INSTAGRAM_APP_SECRET}
      META_INSTAGRAM_REDIRECT_URI: ${META_INSTAGRAM_REDIRECT_URI}
      # DISTINCT AES-256 key, must decode to EXACTLY 32 bytes (enforced in MetaTokenStorage).
      META_TOKEN_ENCRYPTION_KEY: ${META_TOKEN_ENCRYPTION_KEY}
      # T-CREATORCONNECT-0902 / Q1.3 — F-0787: all four were missing here. Marketplace client gate
      # (OFF until App Review), admin recipient for creator-connection emails, and the Influora-owned
      # IG system caller for Business Discovery. Q7.4 `:-false`/`:-` forms; see utho.yml comments.
      META_CREATOR_MARKETPLACE_ENABLED: ${META_CREATOR_MARKETPLACE_ENABLED:-false}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-}
      META_SYSTEM_IG_USER_ID: ${META_SYSTEM_IG_USER_ID:-}
      META_SYSTEM_IG_ACCESS_TOKEN: ${META_SYSTEM_IG_ACCESS_TOKEN:-}
      # ---- GST identity (CompanyTaxStartupValidator rejects placeholders) ----
      INFLUORA_COMPANY_GSTIN: ${INFLUORA_COMPANY_GSTIN}
      INFLUORA_COMPANY_ADDRESS: ${INFLUORA_COMPANY_ADDRESS}
      INFLUORA_LEGAL_NAME: ${INFLUORA_LEGAL_NAME}
    depends_on:
      mysql: { condition: service_healthy }
      # clamav has a 90s start_period (ClamAvMalwareScanService is active under prod) -- do NOT
      # use service_healthy here, it would delay API start by up to 90s (F-0390 A8)
      clamav: { condition: service_started }
      redis: { condition: service_started }

  influora-ai:
    image: ghcr.io/influoradigital-bit/influora-ai:latest
    restart: unless-stopped
    logging: *default-logging
    environment:
      APP_ENV: prod
      LOG_LEVEL: INFO
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SARVAM_API_KEY: ${SARVAM_API_KEY}
      # MUST byte-match the Java side (do not swap the two)
      INTERNAL_HMAC_KEY: ${INTERNAL_REQUEST_HMAC_SECRET}
      SERVICE_TOKEN_SIGNING_KEY: ${INTERNAL_SERVICE_TOKEN_SECRET}
      # Internal, not the public https URL -- avoids DNS + a certbot cert existing at first
      # boot (F-0390 A6).
      SPRING_JWKS_URL: http://influora-api:8080/api/v1/.well-known/jwks.json
      SPRING_INTERNAL_BASE_URL: http://influora-api:8080/api/v1
      REDIS_URL: redis://redis:6379
      # n8n trend tagger — read at config.py:394, fails closed (503) on /internal/trendspark/tag
      # without this (F-0390 A7)
      TREND_TAG_INGEST_SECRET: ${TREND_TAG_INGEST_SECRET}
      AI_DAILY_SPEND_CEILING_USD: "15.0"
      AI_SPEND_KILL_SWITCH: "false"
      # T-GOLIVE-0918 [meera · 2026-09-18] — was present in docker-compose.utho.yml (this
      # service's env is not covered by the utho-compose-keysets-match.sh gate, which only
      # checks influora-api) but missing here, so this shared box silently ran the code
      # default (0.75) instead of a value ops could override. Source: influora-ai/app/config.py
      # L455-457 (_get_float("AI_CREATOR_MONTHLY_CAP_USD", 0.75)).
      # REPAIR ROUND 1 LOW: the value added here was itself a bare "0.75" literal, same defect
      # as docker-compose.utho.yml — switched both to `${AI_CREATOR_MONTHLY_CAP_USD:-0.75}` so
      # go-live-0918.md §2's "set this in the env file" instruction is actually true on both
      # boxes. Default unchanged.
      AI_CREATOR_MONTHLY_CAP_USD: ${AI_CREATOR_MONTHLY_CAP_USD:-0.75}
      # P1 BLANK TURN fix (2026-07-24, wiki/ai-review/meera-blank-turn-ai-
      # review.md): previously UNSET here, silently inheriting the Python
      # default (384), which sat exactly on create_campaign's tool-JSON
      # truncation boundary and caused ~28% of Meera turns on this box to
      # come back completely blank. PINNED explicitly so it can never again
      # silently fall back to a code default.
      # Meera streams to the BROWSER (meera-api.ts hits `${VITE_MEERA_STREAM_URL}/stream`
      # directly), so the AI service needs its own CORS allowlist — separate from the Java
      # one above. This was previously UNSET, which config.py defaults to "" — an empty list,
      # i.e. every browser origin refused. Same three origins as the API for the same reason.
      # Never "*": a bearer Authorization header requires an explicit origin echo.
      MEERA_ALLOWED_ORIGINS: https://${APP_DOMAIN},https://${ROOT_DOMAIN},https://www.${ROOT_DOMAIN}
      MEERA_CHAT_MAX_TOKENS: "1536"
      MEERA_CHAT_MAX_TOKENS_RETRY: "2048"
    depends_on:
      - influora-api

  frontend:
    image: ghcr.io/influoradigital-bit/influora-web:latest
    restart: unless-stopped
    logging: *default-logging
    # No env here — the API URL is already baked into the bundle at build time.

volumes:
  mysql_data:
  clamav_data:
  caddy_data:
  caddy_config:
