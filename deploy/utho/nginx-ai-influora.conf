# ai.influora.in ONLY — the Python AI service (Meera SSE).
#
# WHY THIS FILE EXISTS SEPARATELY FROM nginx-influora-app.conf
# Verified on the live box 2026-09-06: ai/api/app.influora.in have NO server block, so
# nginx hands them to the default vhost — snapsby.com's Cloudflare origin. That is why
# https://ai.influora.in served snapsby HTML under a CN=snapsby.com certificate, and why
# MEERA_PUBLIC_CHAT_URL had been pointed at the apex instead (https://influora.in/meera/chat),
# where the static SPA vhost answers POST with nginx's own 405.
#
# This file declares ai.influora.in and NOTHING else. nginx-influora-app.conf also declares
# app + api on the same :80 block; installing both at once would give two enabled files the
# same server_name and nginx would silently pick one — the exact fault class that made every
# domain serve Influora on 2026-08-21. Land ai first, prove Meera, then do app/api as its
# own reversible step.
#
# Install with deploy/utho/install-ai-vhost.sh — it enforces the two-phase order below.
# Installing this file by hand in one shot CANNOT work: the HTTPS block references a
# certificate that does not exist yet, so `nginx -t` fails and you cannot reload to serve
# the ACME challenge that would create it.

# ---- :80 — ACME challenge + redirect. Must be live BEFORE certbot runs. ----
server {
    listen 80;
    listen [::]:80;
    server_name ai.influora.in;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- :443 — proxy to Caddy on 127.0.0.1:8080, which routes by Host to influora-ai:8000 ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.influora.in;

    ssl_certificate     /etc/letsencrypt/live/ai.influora.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.influora.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # Caddy routes by Host ({$AI_DOMAIN} site block in deploy/utho/Caddyfile).
        # Rewrite Host here and the request lands in the wrong Caddy site — or none.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # THE SSE SET — Caddy's `flush_interval -1` expressed in nginx. Without these three
        # Meera's token-by-token stream is buffered and the user sees nothing until the turn
        # completes, which reads as a hang, not a bug. This is the single most common way to
        # "successfully" install this vhost and still have Meera look broken.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # A long stream must not be cut at nginx's 60s default.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
