# Influora on Utho — nginx front door for the three product subdomains.
#
# Install:  /etc/nginx/sites-available/influora.conf
#           ln -s ../sites-available/influora.conf /etc/nginx/sites-enabled/influora.conf
#           nginx -t && systemctl reload nginx
#
# This file ADDS server blocks. It must not modify or replace the existing default vhost,
# which serves snapsby.com as its Cloudflare origin — that site stays up throughout.
#
# Everything here proxies to Caddy on 127.0.0.1:8080, which routes by Host to the right
# container. The per-host tuning below MUST mirror deploy/utho/Caddyfile: nginx buffers by
# default, and a buffered SSE stream is the failure that looks like "Meera hangs, then
# dumps the whole reply at once".

# ---- HTTP: ACME challenges, everything else redirected ----
server {
    listen 80;
    listen [::]:80;
    server_name app.influora.in api.influora.in ai.influora.in;

    # certbot --webroot -w /var/www/html
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- app.influora.in — the React SPA ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.influora.in;

    ssl_certificate     /etc/letsencrypt/live/app.influora.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.influora.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
    }
}

# ---- api.influora.in — Java API ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.influora.in;

    ssl_certificate     /etc/letsencrypt/live/api.influora.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.influora.in/privkey.pem;

    # Mirrors Caddy's `request_body { max_size 1GB }` and Spring's max-request-size.
    # nginx's default is 1m: leave it and every deliverable upload fails with 413.
    client_max_body_size 1G;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # Mirrors Caddy's read_timeout 300s for large uploads.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        # Stream the upload through instead of spooling 1GB to disk first.
        proxy_request_buffering off;
    }
}

# ---- ai.influora.in — Python AI service, SSE ----
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name ai.influora.in;

    ssl_certificate     /etc/letsencrypt/live/ai.influora.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai.influora.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;

        # THE SSE SET — this is Caddy's `flush_interval -1` expressed in nginx.
        # Without these three, Meera's token-by-token stream is buffered and the user
        # sees nothing until the turn completes, which reads as a hang, not a bug.
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';

        # Mirrors Caddy's read_timeout 3600s — a long stream must not be cut at 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
